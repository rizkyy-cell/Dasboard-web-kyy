<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Merry Christmas, Please Don't Call</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Playfair+Display:ital,wght@0,700;1,700&family=Space+Mono&display=swap" rel="stylesheet" />
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      background-color: #050507;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      margin: 0;
      user-select: none;
    }

    /* 3D INFINITE FILM STRIP SCENE */
    .film-strip-scene {
      position: fixed;
      inset: -50%;
      z-index: 0;
      opacity: 0.15;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 30px;
      transform: rotate(-8deg) scale(1.15);
    }

    .film-track {
      display: flex;
      gap: 20px;
      width: max-content;
      animation: trackScroll 45s linear infinite;
    }

    .film-track.reverse {
      animation-direction: reverse;
    }

    @keyframes trackScroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    .film-img-card {
      width: 180px;
      height: 180px;
      border-radius: 14px;
      object-fit: cover;
      background: #18181b;
      filter: grayscale(100%);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .cinematic-vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle, transparent 25%, rgba(0,0,0,0.92) 100%);
      pointer-events: none;
      z-index: 2;
    }

    /* START OVERLAY CARD (CARD MODEL AWAL) */
    #start-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(5, 5, 7, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #start-overlay.hidden-overlay {
      opacity: 0;
      transform: translateY(20px) scale(0.95);
      pointer-events: none;
    }

    .start-card {
      background: #121215;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 20px;
      width: 100%;
      max-width: 320px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* CENTER ACTIVE FOCUS FRAME (ANIMASI DEDIKASI SUDUT DUA DIMENSI) */
    #infinite-viewport {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #focus-box {
      width: 290px;
      height: 290px;
      border-radius: 24px;
      overflow: hidden;
      background: #0f0f12;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.95);
      position: relative;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
      will-change: transform, opacity;
    }

    /* VARIASI POP-UP VARIAN MOTION */
    .motion-variant-0 { transform: scale(0.85) translate(-20px, -15px) rotate(-4deg); opacity: 0; }
    .motion-variant-1 { transform: scale(0.85) translate(20px, 15px) rotate(4deg); opacity: 0; }
    .motion-variant-2 { transform: scale(1.1) translate(0px, 20px) rotate(-2deg); opacity: 0; }
    .motion-variant-3 { transform: scale(0.85) translate(-15px, 20px) rotate(3deg); opacity: 0; }

    /* LYRICS WORD HIGHLIGHT */
    .word-span {
      opacity: 0.3;
      transition: opacity 0.25s ease, font-weight 0.25s ease;
      display: inline-block;
      margin: 0 2px;
    }

    .word-span.active {
      opacity: 1;
      font-weight: 700;
      text-shadow: 0 0 12px rgba(255,255,255,0.6);
    }

    .italic-serif {
      font-family: 'Playfair Display', serif;
      font-style: italic;
    }

    .glass-card {
      background: rgba(18, 18, 22, 0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 14px 16px;
      width: 100%;
      max-width: 380px;
    }
  </style>
</head>

<body>

  <!-- Background 3D Film Strips -->
  <div class="film-strip-scene">
    <div class="film-track" id="track1"></div>
    <div class="film-track reverse" id="track2"></div>
    <div class="film-track" id="track3"></div>
  </div>

  <div class="cinematic-vignette"></div>

  <!-- START OVERLAY CARD (CARD MODEL AWAL) -->
  <div id="start-overlay">
    <div class="start-card">
      <!-- Album Cover -->
      <div class="aspect-square w-full rounded-2xl overflow-hidden bg-zinc-900 border border-white/10 relative">
        <img id="overlayCover" src="" class="w-full h-full object-cover" />
        <div id="overlayCoverLoading" class="absolute inset-0 flex items-center justify-center font-mono text-xs text-white/30">Loading...</div>
      </div>

      <!-- Title & Artist -->
      <div class="text-left space-y-0.5">
        <h2 class="text-lg font-bold text-white tracking-tight">Merry Christmas, Please Don't Call</h2>
        <p class="text-xs text-white/50 font-medium">Bleach-Ears</p>
      </div>

      <!-- Time & Progress Bar -->
      <div class="space-y-1.5">
        <div class="flex justify-between text-[11px] font-mono text-white/40">
          <span>0:00</span>
          <span>-0:24</span>
        </div>
        <div class="w-full bg-white/10 h-1 rounded-full overflow-hidden">
          <div id="overlayProgress" class="bg-white h-full w-0"></div>
        </div>
      </div>

      <!-- Controls Row -->
      <div class="flex items-center justify-between pt-1">
        <button class="text-white/30 cursor-not-allowed">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"></polygon><polygon points="9 20 1 12 9 4 9 20"></polygon></svg>
        </button>
        
        <!-- MAIN PLAY BUTTON -->
        <button id="overlayPlayBtn" class="w-14 h-14 bg-white text-black rounded-full flex items-center justify-center shadow-lg hover:scale-105 active:scale-95 transition-all">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><polygon points="8 5 19 12 8 19 8 5"></polygon></svg>
        </button>

        <button class="text-white/30 cursor-not-allowed">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"></polygon><polygon points="15 4 25 12 15 20 15 4"></polygon></svg>
        </button>
      </div>

      <!-- Volume Bar Dummy -->
      <div class="flex items-center space-x-2 pt-1 opacity-30">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon></svg>
        <div class="flex-1 bg-white/20 h-1 rounded-full"><div class="bg-white h-full w-2/3"></div></div>
      </div>
    </div>
  </div>

  <!-- Camera Viewport & Active Content -->
  <div id="infinite-viewport">
    <div id="focus-box">
      <img id="activeImage" src="" class="w-full h-full object-cover transition-opacity duration-300 opacity-0" />
      <div id="loadingText" class="absolute inset-0 flex items-center justify-center font-mono text-xs text-white/30 uppercase tracking-widest">
        Loading...
      </div>
    </div>

    <div class="mt-6 min-h-[60px] max-w-sm text-center px-4">
      <p id="lyricsContainer" class="text-xl md:text-2xl italic-serif text-white/90 leading-snug">
        "Press play to start..."
      </p>
    </div>
  </div>

  <!-- Bottom Player Floating Card -->
  <div class="fixed bottom-6 left-0 right-0 z-30 flex justify-center px-4">
    <div class="glass-card">
      <div class="flex items-center space-x-3.5">
        <img id="playerCover" src="" class="w-12 h-12 rounded-xl object-cover bg-zinc-900 border border-white/10 flex-shrink-0" />
        
        <div class="flex-1 min-w-0 text-left">
          <div class="flex justify-between items-baseline mb-1">
            <h1 class="text-xs font-bold text-white truncate">Merry Christmas, Please Don't Call</h1>
            <span id="timeRemaining" class="font-mono text-[10px] text-white/40">-0:24</span>
          </div>
          <p class="text-[10px] text-white/40 mb-1">Bleach-Ears</p>
          
          <div class="w-full bg-white/10 h-1 rounded-full overflow-hidden">
            <div id="progressFill" class="bg-white h-full w-0 transition-all duration-100"></div>
          </div>
        </div>

        <button id="start-btn" class="w-10 h-10 bg-white text-black rounded-full flex items-center justify-center flex-shrink-0 hover:scale-105 active:scale-95 transition-all">
          <svg id="playIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="8 5 19 12 8 19 8 5"></polygon></svg>
          <svg id="pauseIcon" class="hidden" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
        </button>
      </div>
    </div>
  </div>

  <audio id="audio-player" src="/audio.mp3" preload="auto"></audio>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const END_TIME = 24;

      // TIMELINE LIRIK & FOTO SINKRONISASI PRESISI (10 FOTO)
      const TIMELINE = [
        { time: 0, text: "...", photoIdx: 0 },
        { time: 2.5, photoIdx: 1, words: [{ w: "but", t: 2.5 }, { w: "you", t: 2.8 }, { w: "should", t: 3.1 }, { w: "know", t: 3.4 }, { w: "that", t: 3.8 }, { w: "i", t: 4.1 }, { w: "died", t: 4.4 }, { w: "slow", t: 4.9 }] },
        { time: 6.8, photoIdx: 2, words: [{ w: "running", t: 6.8 }, { w: "through", t: 7.2 }, { w: "the", t: 7.5 }, { w: "halls", t: 7.8 }, { w: "of", t: 8.2 }, { w: "your", t: 8.5 }, { w: "haunted", t: 8.8 }, { w: "home", t: 9.3 }] },
        { time: 10.8, photoIdx: 3, words: [{ w: "and", t: 10.8 }, { w: "the", t: 11.1 }, { w: "toughest", t: 11.4 }, { w: "part", t: 11.8 }, { w: "is", t: 12.2 }, { w: "that", t: 12.5 }, { w: "we", t: 12.8 }, { w: "both", t: 13.1 }, { w: "know", t: 13.5 }] },
        { time: 14.5, photoIdx: 4, words: [{ w: "what", t: 14.5 }, { w: "happened", t: 14.9 }, { w: "to", t: 15.3 }, { w: "you", t: 15.8 }] },
        { time: 16.5, photoIdx: 5, words: [{ w: "why", t: 16.5 }, { w: "you're", t: 17.0 }, { w: "out", t: 17.4 }, { w: "on", t: 17.8 }, { w: "your", t: 18.2 }, { w: "own", t: 18.6 }] },
        { time: 19.5, photoIdx: 6, words: [{ w: "merry", t: 19.5 }, { w: "christmas", t: 20.0 }] },
        { time: 21.0, photoIdx: 7, words: [{ w: "please", t: 21.0 }, { w: "don't", t: 21.4 }, { w: "call", t: 21.8 }] },
        { time: 22.4, photoIdx: 8, words: [{ w: "merry", t: 22.4 }, { w: "christmas", t: 22.7 }] },
        { time: 23.2, photoIdx: 9, words: [{ w: "please", t: 23.2 }, { w: "don't", t: 23.5 }, { w: "call", t: 23.8 }] }
      ];

      let galleryUrls = [];
      let isPlaying = false;
      let activeIndex = -1;

      const audio = document.getElementById('audio-player');
      const startBtn = document.getElementById('start-btn');
      const overlayPlayBtn = document.getElementById('overlayPlayBtn');
      const startOverlay = document.getElementById('start-overlay');
      const playIcon = document.getElementById('playIcon');
      const pauseIcon = document.getElementById('pauseIcon');
      const lyricsContainer = document.getElementById('lyricsContainer');
      const activeImage = document.getElementById('activeImage');
      const focusBox = document.getElementById('focus-box');
      const loadingText = document.getElementById('loadingText');
      const playerCover = document.getElementById('playerCover');
      const overlayCover = document.getElementById('overlayCover');
      const overlayCoverLoading = document.getElementById('overlayCoverLoading');
      const progressFill = document.getElementById('progressFill');
      const overlayProgress = document.getElementById('overlayProgress');
      const timeRemaining = document.getElementById('timeRemaining');

      function getSlug() {
        const q = new URLSearchParams(window.location.search).get('id');
        if (q) return q;
        const p = window.location.pathname.split('/').filter(Boolean)[0];
        return (p && p !== 'view.html') ? p : null;
      }

      async function init() {
        const slug = getSlug();
        if (!slug) return;

        try {
          const res = await fetch('/api/config');
          const config = await res.json();
          if (!config.supabaseUrl || !config.supabaseAnonKey) return;

          const supabase = window.supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);
          const { data } = await supabase.from('sites').select('*').eq('slug', slug).single();

          if (!data) return;

          galleryUrls = data.gallery_urls || [];
          
          // Set Cover ke Modal & Player
          const cUrl = data.cover_url || (galleryUrls.length > 0 ? galleryUrls[0] : '');
          if (cUrl) {
            overlayCover.src = cUrl;
            playerCover.src = cUrl;
            overlayCoverLoading.classList.add('hidden');
          }

          // Populate Film Tracks Background
          const allImgs = [cUrl, ...galleryUrls, ...galleryUrls];
          ['track1', 'track2', 'track3'].forEach(trackId => {
            const track = document.getElementById(trackId);
            track.innerHTML = "";
            allImgs.forEach(src => {
              const img = document.createElement('img');
              img.src = src;
              img.className = 'film-img-card';
              track.appendChild(img);
            });
          });

          // Set Photo Pertama
          if (galleryUrls.length > 0) {
            activeImage.src = galleryUrls[0];
            activeImage.classList.remove('opacity-0');
            loadingText.classList.add('hidden');
          }

        } catch (e) {
          console.error(e);
        }
      }

      function togglePlay() {
        if (isPlaying) {
          audio.pause();
        } else {
          if (audio.currentTime >= END_TIME) {
            audio.currentTime = 0;
            activeIndex = -1;
          }
          audio.play();
          startOverlay.classList.add('hidden-overlay');
        }
      }

      overlayPlayBtn.onclick = togglePlay;
      startBtn.onclick = togglePlay;

      audio.onplay = () => {
        isPlaying = true;
        playIcon.classList.add('hidden');
        pauseIcon.classList.remove('hidden');
      };

      audio.onpause = () => {
        isPlaying = false;
        playIcon.classList.remove('hidden');
        pauseIcon.classList.add('hidden');
      };

      // FUNGSI AUTO-RESET KETIKA LAGU SELESAI
      audio.onended = resetToStartOverlay;

      function resetToStartOverlay() {
        audio.pause();
        audio.currentTime = 0;
        isPlaying = false;
        activeIndex = -1;
        playIcon.classList.remove('hidden');
        pauseIcon.classList.add('hidden');
        progressFill.style.width = '0%';
        overlayProgress.style.width = '0%';
        timeRemaining.innerText = '-0:24';
        lyricsContainer.innerText = '"Press play to start..."';
        
        // Buka Kembali Start Modal Overlay
        startOverlay.classList.remove('hidden-overlay');
      }

      audio.ontimeupdate = () => {
        const cur = audio.currentTime;

        // Jika Mencapai Detik 24 -> Auto Reset ke Overlay Awal
        if (cur >= END_TIME) {
          resetToStartOverlay();
          return;
        }

        const rem = Math.max(0, END_TIME - cur);
        timeRemaining.innerText = `-0:${Math.ceil(rem).toString().padStart(2, '0')}`;
        const pPercent = (cur / END_TIME) * 100;
        progressFill.style.width = `${pPercent}%`;
        overlayProgress.style.width = `${pPercent}%`;

        let currentIdx = -1;
        for (let i = TIMELINE.length - 1; i >= 0; i--) {
          if (cur >= TIMELINE[i].time) {
            currentIdx = i;
            break;
          }
        }

        if (currentIdx !== -1 && currentIdx !== activeIndex) {
          activeIndex = currentIdx;
          const sec = TIMELINE[currentIdx];

          const pIdx = sec.photoIdx;
          if (galleryUrls[pIdx]) {
            // VARIASI POP-UP MULTI SUDUT (TIDAK MANTUL DI TEMPAT)
            const variantClass = `motion-variant-${activeIndex % 4}`;
            focusBox.className = variantClass;

            setTimeout(() => {
              activeImage.src = galleryUrls[pIdx];
              activeImage.classList.remove('opacity-0');
              focusBox.className = ""; // Reset ke posisi center normal
            }, 180);
          }

          if (sec.words) {
            lyricsContainer.innerHTML = `"${sec.words.map(item => `<span class="word-span" data-time="${item.t}">${item.w}</span>`).join(' ')}"`;
          } else {
            lyricsContainer.innerHTML = `"${sec.text}"`;
          }
        }

        if (activeIndex !== -1 && TIMELINE[activeIndex].words) {
          const spans = lyricsContainer.querySelectorAll('.word-span');
          spans.forEach(span => {
            const t = parseFloat(span.getAttribute('data-time'));
            if (cur >= t) {
              span.classList.add('active');
            } else {
              span.classList.remove('active');
            }
          });
        }
      };

      init();
    });
  </script>
</body>
</html>

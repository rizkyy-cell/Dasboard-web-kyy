<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>jrxrezkyy — Assistant</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* ================= TEMA — DEFAULT GELAP ================= */
  :root{
    --bg-sidebar:#17212b;
    --bg-main:#0e1621;
    --bg-input:#1c2733;
    --text-main:#ffffff;
    --text-soft:#8296a8;
    --border:rgba(255,255,255,.08);
    --accent:#3390ec;
    --accent-hover:#2b7bcf;
    --bubble-user:#22344a;
    --sidebar-hover:rgba(255,255,255,.06);
    --code-bg:#0b1119;
  }
  body.light-theme{
    --bg-sidebar:#F4F1EA;
    --bg-main:#FAF9F5;
    --bg-input:#FFFFFF;
    --text-main:#3D3929;
    --text-soft:#6B6656;
    --border:#E5E1D8;
    --accent:#D97757;
    --accent-hover:#C56646;
    --bubble-user:#EFECE3;
    --sidebar-hover:#EAE6DB;
    --code-bg:#282C34;
  }

  /* 1. HILANGKAN WARNA BIRU & HIGHLIGHT SAAT DIKLIK/DITAP */
  *{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color: transparent;
    user-select: none; /* Mencegah seleksi teks kaku saat diklik cepat */
  }
  
  /* Biarkan textarea dan bubble pesan tetap bisa diseleksi teksnya */
  textarea, .msg-bubble, .chat-item-title {
    user-select: text;
  }
  
  /* TRANSISI SMOOTH UNTUK TEMA */
  body, .sidebar, .main, .topbar, .input-box, .msg-bubble, .glass-popup-card {
    transition: background-color 0.4s ease, color 0.4s ease, border-color 0.4s ease;
  }

  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    background:var(--bg-main);
    color:var(--text-main);
    height:100vh;
    height:100dvh;
    display:flex;
    overflow:hidden;
  }

  /* SIDEBAR (RIWAYAT CHAT) */
  .sidebar{
    width:260px;
    background:var(--bg-sidebar);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    flex-shrink:0;
    transition:margin-left .2s ease, background-color 0.4s ease, border-color 0.4s ease;
    z-index:100;
  }
  .sidebar.collapsed{margin-left:-260px;}
  .sidebar-header{
    display:flex;
    align-items:center;
    gap:8px;
    padding:16px;
  }
  .logo{
    width:28px;height:28px;
    background:var(--accent);
    border-radius:7px;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:700;font-size:15px;
    flex-shrink:0;
    overflow:hidden;
  }
  .logo-text{font-weight:600;font-size:15px;color:var(--text-main);}
  .new-chat-btn{
    margin:4px 12px 12px;
    padding:9px 14px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:14px;
    font-weight:500;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:8px;
    transition:background .15s;
  }
  .new-chat-btn:hover{background:var(--accent-hover);}
  .sidebar-section-label{
    font-size:12px;
    color:var(--text-soft);
    padding:12px 16px 6px;
    font-weight:500;
  }
  .chat-history{
    flex:1;
    overflow-y:auto;
    padding:0 8px;
  }
  .chat-item{
    padding:9px 10px;
    border-radius:7px;
    font-size:13.5px;
    color:var(--text-main);
    cursor:pointer;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-bottom:2px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:6px;
  }
  .chat-item span.chat-item-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
  .chat-item:hover, .chat-item.active{background:var(--sidebar-hover);}
  .chat-item .del-btn{
    opacity:0;
    flex-shrink:0;
    width:20px;height:20px;
    border-radius:5px;
    display:flex;align-items:center;justify-content:center;
    color:var(--text-soft);
    background:transparent;border:none;cursor:pointer;
  }
  .chat-item:hover .del-btn{opacity:1;}
  .chat-item .del-btn:hover{color:#e5484d;background:rgba(229,72,77,.1);}
  .empty-history-hint{
    padding:14px 12px;
    font-size:12.5px;
    color:var(--text-soft);
    line-height:1.5;
  }
  .sidebar-footer{
    padding:12px;
    border-top:1px solid var(--border);
    display:flex;
    align-items:center;
    gap:10px;
    cursor:pointer;
    font-size:13.5px;
    transition:background .15s;
  }
  .sidebar-footer:hover{background:var(--sidebar-hover);}
  .avatar{
    width:28px;height:28px;
    border-radius:50%;
    background:var(--accent);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:600;
    flex-shrink:0;
    overflow:hidden;
  }
  .avatar img, .logo img, .empty-logo img{width:100%;height:100%;object-fit:cover;border-radius:inherit;}
  #footerLabel{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* MAIN AREA */
  .main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
    position:relative;
    height:100%;
  }
  
  /* TOPBAR */
  .topbar{
    display:flex;
    align-items:center;
    gap:8px;
    padding:12px 16px;
    border-bottom:1px solid var(--border);
    background:var(--bg-main);
    z-index:10;
    position:relative;
  }
  .icon-btn{
    width:34px;height:34px;
    display:flex;align-items:center;justify-content:center;
    border-radius:8px;
    cursor:pointer;
    border:none;
    background:transparent;
    color:var(--text-soft);
    flex-shrink:0;
  }
  .icon-btn:hover{background:var(--sidebar-hover);}
  
  /* GROUP KANAN TOPBAR (SHORTCUT NEW CHAT + EXIT) */
  .topbar-right-group {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .exit-btn {
    text-decoration: none;
  }

  .model-selector{
    display:flex;
    align-items:center;
    gap:6px;
    padding:6px 10px;
    border-radius:8px;
    font-size:14px;
    font-weight:600;
    color:var(--text-main);
    cursor:pointer;
    position:relative;
  }
  .model-selector:hover{background:var(--sidebar-hover);}
  
  /* DROPDOWN MODE ASISTEN DENGAN ANIMASI SMOOTH */
  .mode-dropdown{
    position:absolute;top:110%;left:0;
    background:var(--bg-input);
    border:1px solid var(--border);
    border-radius:12px;
    box-shadow:0 10px 28px rgba(0,0,0,.35);
    padding:6px;
    width:230px;
    z-index:60;
    animation: dropdownFade 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    transform-origin: top left;
  }

  @keyframes dropdownFade {
    0% {
      opacity: 0;
      transform: translateY(-8px) scale(0.96);
    }
    100% {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  .mode-option{padding:10px 12px;border-radius:9px;cursor:pointer; transition: background 0.15s ease;}
  .mode-option:hover, .mode-option.active{background:var(--sidebar-hover);}
  .mode-option-title{font-size:13.5px;font-weight:600;color:var(--text-main);}
  .mode-option-desc{font-size:11.5px;color:var(--text-soft);margin-top:2px;}

  .chat-area{
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    width:100%;
  }
  .chat-inner{
    width:100%;
    max-width:760px;
    padding:20px 16px 140px;
  }

  /* EMPTY STATE */
  .empty-state{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
  }
  .empty-logo{
    width:54px;height:54px;
    background:var(--accent);
    border-radius:14px;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:700;font-size:26px;
    margin-bottom:16px;
    overflow:hidden;
  }
  .empty-title{
    font-size:24px;
    font-weight:600;
    color:var(--text-main);
    margin-bottom:8px;
  }
  .empty-sub{
    font-size:14px;
    color:var(--text-soft);
  }

  /* MESSAGES */
  .msg-row{display:flex;margin-bottom:20px;}
  .msg-row.user{justify-content:flex-end;}
  .msg-bubble{max-width:min(88%,680px);line-height:1.6;font-size:14.5px;}
  .msg-row.user .msg-bubble{
    background:var(--bubble-user);
    padding:10px 16px;
    border-radius:16px 16px 4px 16px;
  }
  .msg-row.assistant .msg-bubble{width:100%;max-width:100%;}
  .msg-bubble p{margin-bottom:10px;}
  .msg-bubble p:last-child{margin-bottom:0;}

  /* INPUT BOX */
  .input-wrap{
    position:absolute;
    bottom:0;left:260px;right:0;
    display:flex;
    justify-content:center;
    padding:12px 16px max(16px, env(safe-area-inset-bottom));
    background:linear-gradient(to top, var(--bg-main) 70%, transparent);
    transition:left .2s ease;
    z-index:20;
  }
  .sidebar.collapsed ~ .main .input-wrap{left:0;}
  .input-box-container{width:100%;max-width:760px;}
  .input-box{
    width:100%;
    background:var(--bg-input);
    border:1px solid var(--border);
    border-radius:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.15);
    padding:8px 8px 8px 16px;
    display:flex;
    align-items:flex-end;
    gap:8px;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  
  /* DRAG & DROP OVERLAY STYLE */
  .input-box.drag-over {
    border: 2px dashed var(--accent);
    box-shadow: 0 0 15px rgba(51,144,236,0.3);
  }

  /* PRATINJAU LAMPIRAN — FILE DITAHAN DI SINI SAMPAI USER KLIK KIRIM */
  .attach-preview-bar{
    display:none;
    flex-wrap:wrap;
    gap:8px;
    padding:0 4px 10px;
  }
  .attach-preview-bar.show{display:flex;}
  .attach-chip{
    position:relative;
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--bg-input);
    border:1px solid var(--border);
    border-radius:14px;
    padding:6px 10px 6px 6px;
    max-width:220px;
    animation:chipIn .18s ease;
  }
  @keyframes chipIn{from{opacity:0;transform:translateY(4px) scale(.96);}to{opacity:1;transform:none;}}
  .attach-chip .attach-thumb{
    width:36px;height:36px;border-radius:9px;
    object-fit:cover;flex-shrink:0;background:var(--bg-sidebar);
  }
  .attach-chip .attach-icon{
    width:36px;height:36px;border-radius:9px;
    display:flex;align-items:center;justify-content:center;
    font-size:18px;background:var(--bg-sidebar);flex-shrink:0;
  }
  .attach-chip .attach-info{min-width:0;}
  .attach-chip .attach-name{
    font-size:12.5px;font-weight:600;color:var(--text-main);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px;
  }
  .attach-chip .attach-meta{font-size:10.5px;color:var(--text-soft);}
  .attach-chip .attach-remove{
    position:absolute;top:-6px;right:-6px;
    width:18px;height:18px;border-radius:50%;
    background:var(--accent);color:#fff;border:none;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;line-height:1;cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,.3);
  }

  /* TOMBOL LAMPIRKAN FILE (PAPERCLIP) — untuk mobile yang tidak bisa drag & drop */
  .attach-btn{
    width:34px;height:34px;border-radius:50%;
    background:transparent;border:none;color:var(--text-soft);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;cursor:pointer;
  }
  .attach-btn:hover{background:var(--sidebar-hover);color:var(--text-main);}

  .input-box textarea{
    flex:1;
    border:none;
    outline:none;
    resize:none;
    font-size:15px;
    font-family:inherit;
    max-height:160px;
    padding:8px 0;
    background:transparent;
    color:var(--text-main);
  }
  .send-btn{
    width:36px;height:36px;
    border-radius:50%;
    background:var(--accent);
    border:none;
    color:#fff;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .send-btn:hover{background:var(--accent-hover);}
  .send-btn:disabled{background:var(--border);cursor:not-allowed;}
  .disclaimer{
    text-align:center;
    font-size:11px;
    color:var(--text-soft);
    padding-top:6px;
  }

  /* POPUP PENGATURAN MODERN */
  .glass-popup-overlay{
    display:none;
    position:fixed;inset:0;
    background:rgba(0,0,0,.55);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    z-index:200;
    align-items:center;
    justify-content:center;
    opacity:0;
    transition:opacity .2s ease;
  }
  .glass-popup-overlay.show{display:flex;}
  .glass-popup-overlay.visible{opacity:1;}
  .glass-popup-card{
    background:var(--bg-sidebar);
    border:1px solid var(--border);
    border-radius:20px;
    padding:20px;
    width:88%;
    max-width:320px;
    color:var(--text-main);
    box-shadow:0 20px 40px rgba(0,0,0,.5);
    backdrop-filter:blur(20px);
    transform:scale(.92);
    transition:transform .2s ease, background-color 0.4s ease;
  }
  .glass-popup-overlay.visible .glass-popup-card{transform:scale(1);}
  .glass-popup-title{font-size:16px;font-weight:700;margin-bottom:16px;text-align:center;}

  /* SETTING ROW (TOGGLE TEMA) */
  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: 16px;
  }
  .setting-label { font-size: 14px; font-weight: 500; }

  /* TOGGLE SWITCH STYLING */
  .switch {
    position: relative;
    display: inline-block;
    width: 44px;
    height: 24px;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: var(--border);
    transition: .3s;
    border-radius: 24px;
  }
  .slider:before {
    position: absolute; content: "";
    height: 18px; width: 18px;
    left: 3px; bottom: 3px;
    background-color: white;
    transition: .3s;
    border-radius: 50%;
  }
  input:checked + .slider { background-color: var(--accent); }
  input:checked + .slider:before { transform: translateX(20px); }

  /* MOBILE RESPONSIVE */
  @media (max-width:768px){
    .sidebar{
      position:fixed;
      top:0;left:0;bottom:0;
      z-index:100;
      margin-left:-260px;
    }
    .sidebar.open{margin-left:0;}
    .input-wrap{
      left:0 !important;
      right:0;
      padding:10px 12px max(12px, env(safe-area-inset-bottom));
    }
    .chat-inner{padding:16px 12px 140px;}
  }
  .backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:90;}
  .backdrop.show{display:block;}

  /* ================= ANIMASI TYPING GAYA CLAUDE (BENTUK K) ================= */
  .typing-dots {
    display: flex;
    align-items: center;
    min-height: 20px; 
  }
  .typing-dots::after {
    content: "K"; 
    font-family: inherit;
    font-weight: bold;
    font-size: 16px;
    color: var(--text-soft);
    animation: claudeKTyping 1.5s ease-in-out infinite;
    opacity: 0;
  }

  @keyframes claudeKTyping {
    0% { opacity: 0; transform: translateY(3px); }
    30%, 60% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(3px); }
  }

</style>
</head>
<body>

<!-- SIDEBAR RIWAYAT CHAT -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="logo" id="mainLogo">J</div>
    <div class="logo-text">jrxrezkyy</div>
  </div>
  <button class="new-chat-btn" onclick="newChat()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
    Obrolan baru
  </button>
  <div class="sidebar-section-label">Riwayat</div>
  <div class="chat-history" id="chatHistory"></div>
  <div class="sidebar-footer" id="sidebarFooter" onclick="openSettingsPopup()">
    <div class="avatar" id="footerAvatar">?</div>
    <div id="footerLabel">Pengaturan</div>
  </div>
</div>

<div class="backdrop" id="backdrop" onclick="closeMobileSidebar()"></div>

<!-- MAIN CONTENT -->
<div class="main">
  <!-- TOPBAR -->
  <div class="topbar">
    <!-- 1. Icon Garis 3 -->
    <button class="icon-btn" onclick="toggleSidebar()" title="Riwayat Chat">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>

    <!-- 2. Dropdown Ganti Mode Asisten -->
    <div class="model-selector" id="modelSelectorBtn" onclick="toggleModeDropdown()">
      <span id="modelSelectorLabel">jrxrezkyy Assistant</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
    </div>

    <!-- 3. Group Icon Kanan (Shortcut Chat Baru + Exit) -->
    <div class="topbar-right-group">
      <!-- Shortcut Obrolan Baru -->
      <button class="icon-btn" onclick="newChat()" title="Obrolan Baru">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          <line x1="12" y1="8" x2="12" y2="14"></line>
          <line x1="9" y1="11" x2="15" y2="11"></line>
        </svg>
      </button>

      <!-- Icon Pintu Keluar -->
      <a href="https://jrxrezkyy-dashboard.vercel.app" class="icon-btn exit-btn" title="Kembali ke Dashboard">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </a>
    </div>
  </div>

  <div class="chat-area" id="chatArea">
    <div class="empty-state" id="emptyState">
      <div class="empty-logo" id="emptyLogo">J</div>
      <div class="empty-title">Ada yang bisa saya bantu?</div>
      <div class="empty-sub" id="emptySub">Tanya apa saja soal Dashboard Web Kyy.</div>
    </div>
    <div class="chat-inner" id="chatInner" style="display:none;"></div>
  </div>

  <!-- INPUT AREA (DENGAN DUKUNGAN DRAG & DROP) -->
  <div class="input-wrap">
    <div class="input-box-container">
      <div class="attach-preview-bar" id="attachPreviewBar"></div>
      <div class="input-box" id="dropArea">
        <input type="file" id="fileInputHidden" multiple style="display:none" onchange="handleFileInputChange(event)">
        <button class="attach-btn" type="button" onclick="document.getElementById('fileInputHidden').click()" title="Lampirkan file">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a5.5 5.5 0 0 1-7.78-7.78l9.19-9.19a3.5 3.5 0 0 1 4.95 4.95l-9.19 9.19a1.5 1.5 0 0 1-2.12-2.12l8.49-8.48"/></svg>
        </button>
        <textarea id="userInput" placeholder="Tanyakan apa saja atau seret file/media ke sini..." rows="1" onkeydown="handleKey(event)" oninput="autoGrow(this)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
      <div class="disclaimer">jrxrezkyy dapat membuat kesalahan. Periksa kembali jawaban penting.</div>
    </div>
  </div>
</div>

<!-- POPUP PENGATURAN MODERN -->
<div class="glass-popup-overlay" id="settingsPopup" onclick="closeSettingsPopup(event)">
  <div class="glass-popup-card" onclick="event.stopPropagation()">
    <div class="glass-popup-title">Pengaturan</div>
    
    <!-- TOGGLE TEMA GELAP/TERANG -->
    <div class="setting-row">
      <span class="setting-label">Tema Terang</span>
      <label class="switch">
        <input type="checkbox" id="themeToggle" onchange="toggleTheme()">
        <span class="slider"></span>
      </label>
    </div>

    <button class="icon-btn" style="width:100%; background:var(--accent); color:#fff; border-radius:10px; height:36px; margin-top:8px;" onclick="closeSettingsPopup()">Tutup</button>
  </div>
</div>

/* ================= DRAG & DROP + LAMPIRAN FILE (DITAHAN SAMPAI USER KLIK KIRIM) ================= */
function initDragAndDrop(){
  const dropArea = document.getElementById('dropArea');
  const input = document.getElementById('userInput');

  ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
    window.addEventListener(eventName, preventDefaults, false);
  });

  function preventDefaults (e) {
    e.preventDefault();
    e.stopPropagation();
  }

  ['dragenter', 'dragover'].forEach(eventName => {
    window.addEventListener(eventName, () => dropArea.classList.add('drag-over'), false);
  });

  ['dragleave', 'drop'].forEach(eventName => {
    window.addEventListener(eventName, () => dropArea.classList.remove('drag-over'), false);
  });

  window.addEventListener('drop', (e) => {
    const dt = e.dataTransfer;
    const files = dt.files;

    if (files.length > 0) {
      // File di-drop -> jadi lampiran yang ditahan, BUKAN teks di textarea
      Array.from(files).forEach(file => addAttachment(file));
    } else {
      const text = dt.getData('text');
      if (text) {
        input.value += (input.value ? '\n' : '') + text;
        autoGrow(input);
      }
    }
  });
}

// Dipanggil saat user memilih file lewat tombol paperclip (khusus mobile, drag&drop sering tak tersedia)
function handleFileInputChange(e){

  e.target.value = ''; // reset agar file yang sama bisa dipilih ulang
}

function fileToDataURL(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function fileToText(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsText(file);
  });
}

// Kompres gambar sebelum dikirim (max 1000px, JPEG q0.7) — biar payload nggak kena limit Vercel (~4.5MB)
function compressImageKyy(file, maxSizePx = 1000, quality = 0.7){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (event) => {
      const img = new Image();
      img.src = event.target.result;
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;

        if (width > height) {
          if (width > maxSizePx) { height *= maxSizePx / width; width = maxSizePx; }
        } else {
          if (height > maxSizePx) { width *= maxSizePx / height; height = maxSizePx; }
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        const dataUrl = canvas.toDataURL('image/jpeg', quality);
        resolve({ dataUrl, base64: dataUrl.split(',')[1], mimeType: 'image/jpeg' });
      };
      img.onerror = reject;
    };
    reader.onerror = reject;
  });
}

function categorizeFile(file){
  const name = file.name.toLowerCase();
  if (file.type.startsWith('image/')) return 'image';
  if (file.type.startsWith('text/') || name.endsWith('.txt') || name.endsWith('.md') || name.endsWith('.json') || name.endsWith('.csv')) return 'text';
  if (file.type.startsWith('audio/')) return 'audio';
  if (file.type.startsWith('video/')) return 'video';
  if (file.type === 'application/pdf') return 'pdf';
  return 'other';
}

function fileIconFor(category){
  switch(category){
    case 'text': return '📄';
    case 'audio': return '🎵';
    case 'video': return '🎬';
    case 'pdf': return '📕';
    default: return '📎';
  }
}

function formatFileSize(bytes){
  if(bytes < 1024) return bytes + ' B';
  if(bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/(1024*1024)).toFixed(1) + ' MB';
}

// Menambahkan file ke daftar lampiran yang DITAHAN — belum dikirim sampai user klik tombol kirim
async function addAttachment(file){
  if(file.size > MAX_ATTACHMENT_MB * 1024 * 1024){
    alert(`File "${file.name}" terlalu besar (maks ${MAX_ATTACHMENT_MB}MB).`);
    return;
  }

  const category = categorizeFile(file);
  const att = {
    id: 'att_' + (++attachSeq) + '_' + Date.now(),
    file,
    name: file.name,
    mime: file.type || 'application/octet-stream',
    size: file.size,
    category,
    previewUrl: null,    // thumbnail + data base64 khusus gambar (dikirim ke AI agar bisa "melihat")
    base64: null,
    textContent: null    // isi file khusus untuk file teks (.txt/.md/.json/.csv)
  };

  // Render dulu (status memuat) supaya chip langsung muncul, baru diisi setelah file selesai dibaca
  pendingAttachments.push(att);
  renderAttachmentPreview();

  try{
    if(category === 'image'){
      const hasil = await compressImageKyy(file, 1000, 0.7);
      att.previewUrl = hasil.dataUrl;
      att.base64 = hasil.base64;
      att.mime = hasil.mimeType; // dipaksa jadi image/jpeg hasil kompresi
    } else if(category === 'text'){
      att.textContent = await fileToText(file);
    }
  }catch(err){
    console.warn('Gagal membaca file lampiran:', err);
  }

  renderAttachmentPreview();
}

function removeAttachment(id){

}

function renderAttachmentPreview(){
  const bar = document.getElementById('attachPreviewBar');
  if(!bar) return;

  if(pendingAttachments.length === 0){
    bar.classList.remove('show');
    bar.innerHTML = '';
    return;
  }

  bar.classList.add('show');
  bar.innerHTML = pendingAttachments.map(att => {
    const thumb = (att.category === 'image' && att.previewUrl)
      ? `<img class="attach-thumb" src="${att.previewUrl}" alt="${escapeHtml(att.name)}">`
      : `<div class="attach-icon">${fileIconFor(att.category)}</div>`;
    return `
      <div class="attach-chip" data-id="${att.id}">
        ${thumb}
        <div class="attach-info">
          <div class="attach-name">${escapeHtml(att.name)}</div>
          <div class="attach-meta">${formatFileSize(att.size)}</div>
        </div>
        <button type="button" class="attach-remove" onclick="removeAttachment('${att.id}')">✕</button>
      </div>
    `;
  }).join('');
}

  if(currentUser){
    try{
      const { data, error } = await supabaseClient
        .from('chat_sessions')
        .insert({ user_id: currentUser.id, title, mode: currentMode })
        .select('id')
        .single();
      if(error) throw error;
      currentSessionId = data.id;
    }catch(err){
      console.warn('Gagal simpan sesi ke Supabase:', err);
      currentSessionId = 'sess_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
    }
  } else {
    currentSessionId = 'sess_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);

      id: currentSessionId,
      title,
      mode: currentMode,
      messages: [],
      createdAt: Date.now()

    saveGuestSessions();

async function persistMessage(role, content){

      const { error } = await supabaseClient.from('chat_history').insert({

        role,
        content
      });
      if(error) throw error;
    }catch(err){
      console.warn('Gagal simpan pesan ke Supabase:', err);
    }
  } else {
    const sess = guestSessions.find(s => s.id === currentSessionId);
    if(sess){
      sess.messages.push({ role, content, ts: Date.now() });
      saveGuestSessions();
    }
  }
}

async function loadSession(id){
  currentSessionId = id;

  if(currentUser){
    try{
      const [{ data: sess }, { data: msgs, error }] = await Promise.all([
        supabaseClient.from('chat_sessions').select('mode').eq('id', id).single(),
        supabaseClient.from('chat_history').select('role,content').eq('session_id', id).order('created_at', { ascending: true })
      ]);
      if(error) throw error;
      currentMode = sess?.mode || currentMode;
      messages = (msgs || []).map(m => ({ role: m.role, content: m.content }));
    }catch(err){
      console.warn('Gagal buka riwayat dari Supabase:', err);
      messages = [];
    }
  } else {
    const sess = guestSessions.find(s => s.id === id);
    if(!sess) return;
    currentMode = sess.mode || currentMode;
    messages = sess.messages.map(m => ({ role: m.role, content: m.content }));
  }

  updateModelLabel();
  document.getElementById('emptyState').style.display = messages.length ? 'none' : 'flex';
  document.getElementById('chatInner').style.display = messages.length ? 'block' : 'none';
  renderMessages();
  loadHistoryForCurrentUser();
  closeMobileSidebar();
  scrollDown();
}

async function deleteSession(id){

    try{
      await supabaseClient.from('chat_sessions').delete().eq('id', id).eq('user_id', currentUser.id);
    }catch(err){
      console.warn('Gagal hapus riwayat di Supabase:', err);
    }
  } else {
    guestSessions = guestSessions.filter(s => s.id !== id);
    saveGuestSessions();
  }

  if(currentSessionId === id){
    currentSessionId = null;
    messages = [];
    renderMessages();
    document.getElementById('emptyState').style.display = 'flex';
    document.getElementById('chatInner').style.display = 'none';
  }
  loadHistoryForCurrentUser();

/* ================= CHAT LOGIC ================= */
async function getCrossSessionContext(limit = 40){
  if(currentUser){
    try{
      let query = supabaseClient
        .from('chat_history')
        .select('role,content,session_id,created_at')
        .eq('user_id', currentUser.id)
        .order('created_at', { ascending: false })
        .limit(limit);
      if(currentSessionId) query = query.neq('session_id', currentSessionId);

      const { data, error } = await query;
      if(error) throw error;
      return (data || []).reverse().map(m => ({ role: m.role, content: m.content }));
    }catch(err){
      console.warn('Gagal ambil memori lintas obrolan (login):', err);
      return [];
    }
  } else {
    const combined = [];
    guestSessions.forEach(s=>{
      if(s.id === currentSessionId) return;
      (s.messages || []).forEach(m => combined.push({ role: m.role, content: m.content, ts: m.ts || 0 }));
    });
    combined.sort((a,b)=> (a.ts||0) - (b.ts||0));
    return combined.slice(-limit).map(m => ({ role: m.role, content: m.content }));
  }
}

async function sendMessage(){
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if((!text && pendingAttachments.length === 0) || sending) return;

  // Tag lampiran yang tampil di bubble chat, biar jelas file apa yang dikirim
  const attachTags = pendingAttachments.map(att => `[Melampirkan file: ${att.name} (${att.mime})]`);
  const finalText = [text, ...attachTags].filter(Boolean).join('\n');

  // ===== SUSUN PAYLOAD SESUAI KONTRAK YANG SUDAH TERBUKTI JALAN DI chat.js/chat_2.js =====
  // Backend cuma kenal field: pesan, gambarData (base64 JPEG), gambarType. Bukan array "lampiran".
  const imageAtt = pendingAttachments.find(a => a.category === 'image' && a.base64);
  const textAtts = pendingAttachments.filter(a => a.category === 'text');
  const otherAtts = pendingAttachments.filter(a => a.category !== 'image' && a.category !== 'text');

  let pesanUntukAI = text;
  textAtts.forEach(att => {
    pesanUntukAI += (pesanUntukAI ? '\n\n' : '') + `Isi File ${att.name}:\n${att.textContent || '(gagal dibaca)'}`;
  });
  otherAtts.forEach(att => {
    pesanUntukAI += (pesanUntukAI ? '\n' : '') + `[User melampirkan file ${att.name} (${att.mime}), tapi AI belum bisa membaca isi file jenis ini.]`;
  });
  if(imageAtt){
    pesanUntukAI = pesanUntukAI
      ? `User mengirimkan gambar dengan deskripsi: ${pesanUntukAI}`
      : 'User mengirimkan gambar.';
  }
  // Kalau user lampirkan lebih dari 1 gambar, cuma yang pertama yang benar-benar "dilihat" AI (batasan backend saat ini)
  if(pendingAttachments.filter(a => a.category === 'image').length > 1){
    console.warn('Lebih dari 1 gambar dilampirkan — hanya gambar pertama yang dikirim ke AI.');
  }

  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('chatInner').style.display = 'block';

  const isFirstMsg = messages.length === 0;
  messages.push({ role: 'user', content: finalText });
  input.value = '';
  autoGrow(input);
  pendingAttachments = [];       // baru dikosongkan SETELAH benar-benar terkirim
  renderAttachmentPreview();
  renderMessages();
  scrollDown();

  if(isFirstMsg) await ensureSession(finalText);
  await persistMessage('user', finalText);

  sending = true;
  document.getElementById('sendBtn').disabled = true;

  const inner = document.getElementById('chatInner');
  const typingRow = document.createElement('div');
  typingRow.className = 'msg-row assistant';
  typingRow.id = 'typingRow';

  typingRow.innerHTML = `
    <div class="msg-bubble">
      <div class="typing-dots"></div>
    </div>
  `;

  inner.appendChild(typingRow);
  scrollDown();

  let replyText = '';
  try{
    const targetEndpoint = currentMode === 'dev' ? '/api/chat_2' : '/api/chat';
    const crossContext = await getCrossSessionContext();
    const riwayatKirim = [...crossContext, ...messages];

    const payloadKirim = {
      pesan: pesanUntukAI,
      riwayat: riwayatKirim,
      mode: currentMode
    };
    if(imageAtt){
      payloadKirim.gambarData = imageAtt.base64;
      payloadKirim.gambarType = imageAtt.mime;
    }

    const res = await fetch(targetEndpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payloadKirim)
    });

    const data = await res.json();
    document.getElementById('typingRow')?.remove();

    replyText = data.error ? '**Error:** ' + data.error : (data.balasan || '(tidak ada respons)');
  } catch(err){
    document.getElementById('typingRow')?.remove();
    replyText = '**Error koneksi:** ' + err.message;
  }

  messages.push({ role: 'assistant', content: replyText });
  await persistMessage('assistant', replyText);

  sending = false;
  document.getElementById('sendBtn').disabled = false;
  renderMessages();
  scrollDown();
}

function renderMessages(){
  const inner = document.getElementById('chatInner');
  inner.innerHTML = '';
  messages.forEach(m => {
    const row = document.createElement('div');
    row.className = 'msg-row ' + m.role;
    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    
    if (m.role === 'user') {
      bubble.innerHTML = escapeHtml(m.content);
    } else {
      bubble.innerHTML = marked.parse(m.content);
      bubble.querySelectorAll('pre code').forEach((block) => {
        hljs.highlightElement(block);
      });
    }
    
    row.appendChild(bubble);
    inner.appendChild(row);
  });
}

function scrollDown(){
  const area = document.getElementById('chatArea');
  area.scrollTop = area.scrollHeight;
}

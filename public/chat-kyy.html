<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>jrxrezkyy — Assistant</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* ================= TEMA — DEFAULT GELAP ================= */
  :root{
    --bg-sidebar:#17212b;
    --bg-main:#0e1621;
    --bg-input:#1c2733;
    --text-main:#ffffff;
    --text-soft:#8296a8;
    --border:rgba(255,255,255,.08);
    --accent:#3390ec;
    --accent-hover:#2b7bcf;
    --bubble-user:#22344a;
    --sidebar-hover:rgba(255,255,255,.06);
    --code-bg:#0b1119;
  }
  body.light-theme{
    --bg-sidebar:#F4F1EA;
    --bg-main:#FAF9F5;
    --bg-input:#FFFFFF;
    --text-main:#3D3929;
    --text-soft:#6B6656;
    --border:#E5E1D8;
    --accent:#D97757;
    --accent-hover:#C56646;
    --bubble-user:#EFECE3;
    --sidebar-hover:#EAE6DB;
    --code-bg:#282C34;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  
  /* FIX DVH AGAR INPUT BOX TIDAK TERPOTONG DI HP */
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    background:var(--bg-main);
    color:var(--text-main);
    height:100vh;
    height:100dvh;
    display:flex;
    overflow:hidden;
    transition:background .2s ease,color .2s ease;
  }

  /* SIDEBAR (RIWAYAT CHAT) */
  .sidebar{
    width:260px;
    background:var(--bg-sidebar);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    flex-shrink:0;
    transition:margin-left .2s ease,background .2s ease,border-color .2s ease;
    z-index:100;
  }
  .sidebar.collapsed{margin-left:-260px;}
  .sidebar-header{
    display:flex;
    align-items:center;
    gap:8px;
    padding:16px;
  }
  .logo{
    width:28px;height:28px;
    background:var(--accent);
    border-radius:7px;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:700;font-size:15px;
    flex-shrink:0;
    overflow:hidden;
  }
  .logo-text{font-weight:600;font-size:15px;color:var(--text-main);}
  .new-chat-btn{
    margin:4px 12px 12px;
    padding:9px 14px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:14px;
    font-weight:500;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:8px;
    transition:background .15s;
  }
  .new-chat-btn:hover{background:var(--accent-hover);}
  .sidebar-section-label{
    font-size:12px;
    color:var(--text-soft);
    padding:12px 16px 6px;
    font-weight:500;
  }
  .chat-history{
    flex:1;
    overflow-y:auto;
    padding:0 8px;
  }
  .chat-item{
    padding:9px 10px;
    border-radius:7px;
    font-size:13.5px;
    color:var(--text-main);
    cursor:pointer;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-bottom:2px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:6px;
  }
  .chat-item span.chat-item-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
  .chat-item:hover, .chat-item.active{background:var(--sidebar-hover);}
  .chat-item .del-btn{
    opacity:0;
    flex-shrink:0;
    width:20px;height:20px;
    border-radius:5px;
    display:flex;align-items:center;justify-content:center;
    color:var(--text-soft);
    background:transparent;border:none;cursor:pointer;
  }
  .chat-item:hover .del-btn{opacity:1;}
  .chat-item .del-btn:hover{color:#e5484d;background:rgba(229,72,77,.1);}
  .empty-history-hint{
    padding:14px 12px;
    font-size:12.5px;
    color:var(--text-soft);
    line-height:1.5;
  }
  .sidebar-footer{
    padding:12px;
    border-top:1px solid var(--border);
    display:flex;
    align-items:center;
    gap:10px;
    cursor:pointer;
    font-size:13.5px;
    transition:background .15s;
  }
  .sidebar-footer:hover{background:var(--sidebar-hover);}
  .avatar{
    width:28px;height:28px;
    border-radius:50%;
    background:var(--accent);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:600;
    flex-shrink:0;
    overflow:hidden;
  }
  .avatar img, .logo img, .empty-logo img{width:100%;height:100%;object-fit:cover;border-radius:inherit;}
  #footerLabel{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* MAIN AREA */
  .main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
    position:relative;
    height:100%;
  }
  
  /* TOPBAR */
  .topbar{
    display:flex;
    align-items:center;
    gap:8px;
    padding:12px 16px;
    border-bottom:1px solid var(--border);
    background:var(--bg-main);
    z-index:10;
    position:relative;
  }
  .icon-btn{
    width:34px;height:34px;
    display:flex;align-items:center;justify-content:center;
    border-radius:8px;
    cursor:pointer;
    border:none;
    background:transparent;
    color:var(--text-soft);
    flex-shrink:0;
  }
  .icon-btn:hover{background:var(--sidebar-hover);}
  
  /* Posisi Icon Pintu Keluar di Paling Kanan Topbar */
  .exit-btn {
    margin-left: auto;
    text-decoration: none;
  }

  .model-selector{
    display:flex;
    align-items:center;
    gap:6px;
    padding:6px 10px;
    border-radius:8px;
    font-size:14px;
    font-weight:600;
    color:var(--text-main);
    cursor:pointer;
    position:relative;
  }
  .model-selector:hover{background:var(--sidebar-hover);}
  
  /* DROPDOWN MODE ASISTEN */
  .mode-dropdown{
    position:absolute;top:110%;left:0;
    background:var(--bg-input);
    border:1px solid var(--border);
    border-radius:12px;
    box-shadow:0 10px 28px rgba(0,0,0,.35);
    padding:6px;
    width:230px;
    z-index:60;
  }
  .mode-option{padding:10px 12px;border-radius:9px;cursor:pointer;}
  .mode-option:hover, .mode-option.active{background:var(--sidebar-hover);}
  .mode-option-title{font-size:13.5px;font-weight:600;color:var(--text-main);}
  .mode-option-desc{font-size:11.5px;color:var(--text-soft);margin-top:2px;}

  .chat-area{
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    width:100%;
  }
  .chat-inner{
    width:100%;
    max-width:760px;
    padding:20px 16px 140px;
  }

  /* EMPTY STATE */
  .empty-state{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
  }
  .empty-logo{
    width:54px;height:54px;
    background:var(--accent);
    border-radius:14px;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:700;font-size:26px;
    margin-bottom:16px;
    overflow:hidden;
  }
  .empty-title{
    font-size:24px;
    font-weight:600;
    color:var(--text-main);
    margin-bottom:8px;
  }
  .empty-sub{
    font-size:14px;
    color:var(--text-soft);
  }

  /* MESSAGES */
  .msg-row{display:flex;margin-bottom:20px;}
  .msg-row.user{justify-content:flex-end;}
  .msg-bubble{max-width:min(88%,680px);line-height:1.6;font-size:14.5px;}
  .msg-row.user .msg-bubble{
    background:var(--bubble-user);
    padding:10px 16px;
    border-radius:16px 16px 4px 16px;
  }
  .msg-row.assistant .msg-bubble{width:100%;max-width:100%;}
  .msg-bubble p{margin-bottom:10px;}
  .msg-bubble p:last-child{margin-bottom:0;}

  /* FIX INPUT BOX TERPOTONG DI HP */
  .input-wrap{
    position:absolute;
    bottom:0;left:260px;right:0;
    display:flex;
    justify-content:center;
    padding:12px 16px max(16px, env(safe-area-inset-bottom));
    background:linear-gradient(to top, var(--bg-main) 70%, transparent);
    transition:left .2s ease;
    z-index:20;
  }
  .sidebar.collapsed ~ .main .input-wrap{left:0;}
  .input-box-container{width:100%;max-width:760px;}
  .input-box{
    width:100%;
    background:var(--bg-input);
    border:1px solid var(--border);
    border-radius:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.15);
    padding:8px 8px 8px 16px;
    display:flex;
    align-items:flex-end;
    gap:8px;
  }
  .input-box textarea{
    flex:1;
    border:none;
    outline:none;
    resize:none;
    font-size:15px;
    font-family:inherit;
    max-height:160px;
    padding:8px 0;
    background:transparent;
    color:var(--text-main);
  }
  .send-btn{
    width:36px;height:36px;
    border-radius:50%;
    background:var(--accent);
    border:none;
    color:#fff;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .send-btn:hover{background:var(--accent-hover);}
  .send-btn:disabled{background:var(--border);cursor:not-allowed;}
  .disclaimer{
    text-align:center;
    font-size:11px;
    color:var(--text-soft);
    padding-top:6px;
  }

  /* POPUP PENGATURAN (MODAL SIDEBAR FOOTER) */
  .glass-popup-overlay{
    display:none;
    position:fixed;inset:0;
    background:rgba(0,0,0,.55);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    z-index:200;
    align-items:center;
    justify-content:center;
    opacity:0;
    transition:opacity .2s ease;
  }
  .glass-popup-overlay.show{display:flex;}
  .glass-popup-overlay.visible{opacity:1;}
  .glass-popup-card{
    background:linear-gradient(135deg, rgba(255,255,255,.12), rgba(255,255,255,.03));
    border:1px solid rgba(255,255,255,.18);
    border-radius:20px;
    padding:18px;
    width:88%;
    max-width:300px;
    color:#fff;
    box-shadow:0 20px 40px rgba(0,0,0,.5);
    backdrop-filter:blur(20px);
    transform:scale(.92);
    transition:transform .2s ease;
  }
  .glass-popup-overlay.visible .glass-popup-card{transform:scale(1);}
  .glass-popup-title{font-size:15px;font-weight:700;margin-bottom:12px;text-align:center;}

  /* MOBILE RESPONSIVE */
  @media (max-width:768px){
    .sidebar{
      position:fixed;
      top:0;left:0;bottom:0;
      z-index:100;
      margin-left:-260px;
    }
    .sidebar.open{margin-left:0;}
    .input-wrap{
      left:0 !important;
      right:0;
      padding:10px 12px max(12px, env(safe-area-inset-bottom));
    }
    .chat-inner{padding:16px 12px 140px;}
  }
  .backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:90;}
  .backdrop.show{display:block;}
</style>
</head>
<body>

<!-- SIDEBAR RIWAYAT CHAT (DIBUKA OLEH GARIS3 PERTAMA) -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="logo" id="mainLogo">J</div>
    <div class="logo-text">jrxrezkyy</div>
  </div>
  <button class="new-chat-btn" onclick="newChat()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
    Obrolan baru
  </button>
  <div class="sidebar-section-label">Riwayat</div>
  <div class="chat-history" id="chatHistory"></div>
  <div class="sidebar-footer" id="sidebarFooter" onclick="openSettingsPopup()">
    <div class="avatar" id="footerAvatar">?</div>
    <div id="footerLabel">Pengaturan</div>
  </div>
</div>

<div class="backdrop" id="backdrop" onclick="closeMobileSidebar()"></div>

<!-- MAIN CONTENT -->
<div class="main">
  <!-- TOPBAR (RAPI & SIMPEL) -->
  <div class="topbar">
    <!-- 1. Icon Garis 3 (Buka Sidebar Riwayat Chat) -->
    <button class="icon-btn" onclick="toggleSidebar()" title="Riwayat Chat">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>

    <!-- 2. Dropdown Ganti Mode Asisten (Tetap Utuh) -->
    <div class="model-selector" id="modelSelectorBtn" onclick="toggleModeDropdown()">
      <span id="modelSelectorLabel">jrxrezkyy Assistant</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
    </div>

    <!-- 3. Icon Pintu Keluar ke Dashboard (Langsung Link) -->
    <a href="https://jrxrezkyy-dashboard.vercel.app" class="icon-btn exit-btn" title="Kembali ke Dashboard">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </a>
  </div>

  <div class="chat-area" id="chatArea">
    <div class="empty-state" id="emptyState">
      <div class="empty-logo" id="emptyLogo">J</div>
      <div class="empty-title">Ada yang bisa saya bantu?</div>
      <div class="empty-sub" id="emptySub">Tanya apa saja soal Dashboard Web Kyy.</div>
    </div>
    <div class="chat-inner" id="chatInner" style="display:none;"></div>
  </div>

  <!-- INPUT AREA (RESPONSIVE BEBAS TERPOTONG DI HP) -->
  <div class="input-wrap">
    <div class="input-box-container">
      <div class="input-box">
        <textarea id="userInput" placeholder="Tanyakan apa saja pada jrxrezkyy..." rows="1" onkeydown="handleKey(event)" oninput="autoGrow(this)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
      <div class="disclaimer">jrxrezkyy dapat membuat kesalahan. Periksa kembali jawaban penting.</div>
    </div>
  </div>
</div>

<!-- POPUP PENGATURAN (AKSES DARI SIDEBAR FOOTER) -->
<div class="glass-popup-overlay" id="settingsPopup" onclick="closeSettingsPopup(event)">
  <div class="glass-popup-card" onclick="event.stopPropagation()">
    <div class="glass-popup-title">Pengaturan</div>
    <div style="font-size:13px; color:var(--text-soft); text-align:center; margin-bottom:12px;">Pengaturan tema & akun.</div>
    <button class="icon-btn" style="width:100%; background:var(--accent); color:#fff; border-radius:10px; height:36px;" onclick="closeSettingsPopup()">Tutup</button>
  </div>
</div>

<script>
marked.setOptions({ breaks:true, gfm:true });

/* ================= SUPABASE ================= */
const SUPABASE_URL = "https://djojqarslfsvubuflwdn.supabase.co";
const SUPABASE_KEY = "sb_publishable_vqUvkJX5XNx5_D75lCnJzw_KPeFSim9";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let currentProfile = null;
let currentSessionId = null;
let messages = [];
let sending = false;
let guestSessions = [];

const GUEST_KEY = 'kyy_guest_chat_sessions';

/* ================= AUTH & AVATAR (SUPABASE AUTH GOOGLE/EMAIL) ================= */
function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function applyProfileUI(){
  const footerAvatar = document.getElementById('footerAvatar');
  const footerLabel = document.getElementById('footerLabel');
  const emptyLogo = document.getElementById('emptyLogo');

  if(currentUser && currentProfile){
    const avatarUrl = currentProfile.avatar_url || '';
    const name = currentProfile.full_name || currentUser.email || 'User';
    if(footerAvatar){
      footerAvatar.innerHTML = avatarUrl
        ? `<img src="${avatarUrl}" alt="${escapeHtml(name)}">`
        : escapeHtml(name.charAt(0).toUpperCase());
    }
    if(footerLabel) footerLabel.textContent = name;
  } else {
    if(footerAvatar) footerAvatar.innerHTML = '?';
    if(footerLabel) footerLabel.textContent = 'Pengaturan (Tamu)';
  }
}

async function initAuth(){
  try{
    const { data } = await supabaseClient.auth.getSession();
    handleAuthSession(data?.session || null);

    supabaseClient.auth.onAuthStateChange((_event, session)=>{
      handleAuthSession(session);
      loadHistoryForCurrentUser();
    });
  }catch(err){
    console.warn('Gagal cek sesi login:', err);
  }
}

function handleAuthSession(session){
  if(session && session.user){
    currentUser = session.user;
    // Data akun Google (nama & foto) otomatis ada di user_metadata via Supabase Auth
    const meta = currentUser.user_metadata || {};
    currentProfile = {
      full_name: meta.full_name || meta.name || '',
      avatar_url: meta.avatar_url || meta.picture || ''
    };
  } else {
    currentUser = null;
    currentProfile = null;
  }
  applyProfileUI();
}

/* ================= SESI & RIWAYAT (TAMU = localStorage, LOGIN = Supabase) ================= */
function loadGuestSessions(){
  try{
    guestSessions = JSON.parse(localStorage.getItem(GUEST_KEY) || '[]');
  }catch(e){
    guestSessions = [];
  }
}

function saveGuestSessions(){
  localStorage.setItem(GUEST_KEY, JSON.stringify(guestSessions));
}

async function loadHistoryForCurrentUser(){
  if(currentUser){
    try{
      const { data, error } = await supabaseClient
        .from('chat_sessions')
        .select('id,title,mode,created_at')
        .eq('user_id', currentUser.id)
        .order('created_at', { ascending: false });
      if(error) throw error;
      renderHistorySidebar(data || []);
    }catch(err){
      console.warn('Gagal ambil riwayat dari Supabase:', err);
      renderHistorySidebar([]);
    }
  } else {
    loadGuestSessions();
    renderHistorySidebar(guestSessions.slice().reverse());
  }
}

function renderHistorySidebar(list){
  const wrap = document.getElementById('chatHistory');
  if(!wrap) return;
  wrap.innerHTML = '';

  if(!list || list.length === 0){
    wrap.innerHTML = '<div class="empty-history-hint">Belum ada riwayat obrolan.</div>';
    return;
  }

  list.forEach(sess=>{
    const item = document.createElement('div');
    item.className = 'chat-item' + (sess.id === currentSessionId ? ' active' : '');
    item.innerHTML = `<span class="chat-item-title">${escapeHtml(sess.title || 'Obrolan')}</span><button class="del-btn" title="Hapus">&times;</button>`;
    item.addEventListener('click', (e)=>{
      if(e.target.closest('.del-btn')) return;
      loadSession(sess.id);
    });
    item.querySelector('.del-btn').addEventListener('click', (e)=>{
      e.stopPropagation();
      deleteSession(sess.id);
    });
    wrap.appendChild(item);
  });
}

async function ensureSession(firstText){
  const title = firstText.length > 40 ? firstText.slice(0,40) + '…' : firstText;

  if(currentUser){
    try{
      // id uuid digenerate otomatis oleh database (default gen_random_uuid())
      const { data, error } = await supabaseClient
        .from('chat_sessions')
        .insert({ user_id: currentUser.id, title, mode: currentMode })
        .select('id')
        .single();
      if(error) throw error;
      currentSessionId = data.id;
    }catch(err){
      console.warn('Gagal simpan sesi ke Supabase:', err);
      currentSessionId = 'sess_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
    }
  } else {
    currentSessionId = 'sess_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
    guestSessions.push({
      id: currentSessionId,
      title,
      mode: currentMode,
      messages: [],
      createdAt: Date.now()
    });
    saveGuestSessions();
  }

  loadHistoryForCurrentUser();
}

async function persistMessage(role, content){
  if(currentUser && currentSessionId){
    try{
      const { error } = await supabaseClient.from('chat_history').insert({
        session_id: currentSessionId,
        user_id: currentUser.id,
        role,
        content
      });
      if(error) throw error;
    }catch(err){
      console.warn('Gagal simpan pesan ke Supabase:', err);
    }
  } else {
    const sess = guestSessions.find(s => s.id === currentSessionId);
    if(sess){
      sess.messages.push({ role, content, ts: Date.now() });
      saveGuestSessions();
    }
  }
}

async function loadSession(id){
  currentSessionId = id;

  if(currentUser){
    try{
      const [{ data: sess }, { data: msgs, error }] = await Promise.all([
        supabaseClient.from('chat_sessions').select('mode').eq('id', id).single(),
        supabaseClient.from('chat_history').select('role,content').eq('session_id', id).order('created_at', { ascending: true })
      ]);
      if(error) throw error;
      currentMode = sess?.mode || currentMode;
      messages = (msgs || []).map(m => ({ role: m.role, content: m.content }));
    }catch(err){
      console.warn('Gagal buka riwayat dari Supabase:', err);
      messages = [];
    }
  } else {
    const sess = guestSessions.find(s => s.id === id);
    if(!sess) return;
    currentMode = sess.mode || currentMode;
    messages = sess.messages.map(m => ({ role: m.role, content: m.content }));
  }

  updateModelLabel();
  document.getElementById('emptyState').style.display = messages.length ? 'none' : 'flex';
  document.getElementById('chatInner').style.display = messages.length ? 'block' : 'none';
  renderMessages();
  loadHistoryForCurrentUser();
  closeMobileSidebar();
  scrollDown();
}

async function deleteSession(id){
  if(currentUser){
    try{
      await supabaseClient.from('chat_sessions').delete().eq('id', id).eq('user_id', currentUser.id);
    }catch(err){
      console.warn('Gagal hapus riwayat di Supabase:', err);
    }
  } else {
    guestSessions = guestSessions.filter(s => s.id !== id);
    saveGuestSessions();
  }

  if(currentSessionId === id){
    currentSessionId = null;
    messages = [];
    renderMessages();
    document.getElementById('emptyState').style.display = 'flex';
    document.getElementById('chatInner').style.display = 'none';
  }
  loadHistoryForCurrentUser();
}

function newChat(){
  currentSessionId = null;
  messages = [];
  renderMessages();
  document.getElementById('emptyState').style.display = 'flex';
  document.getElementById('chatInner').style.display = 'none';
  closeMobileSidebar();
}

/* ================= MODE ASISTEN ================= */
let currentMode = localStorage.getItem('jrx_chat_mode') || 'biasa';

function updateModelLabel(){
  const label = document.getElementById('modelSelectorLabel');
  if(label){
    label.textContent = currentMode === 'dev' ? 'KYY Dev Assistant' : 'jrxrezkyy Assistant';
  }
}

function toggleModeDropdown(){
  let dd = document.getElementById('modeDropdown');
  if(dd){ dd.remove(); return; }

  dd = document.createElement('div');
  dd.id = 'modeDropdown';
  dd.className = 'mode-dropdown';
  dd.innerHTML = `
    <div class="mode-option ${currentMode==='biasa'?'active':''}" data-mode="biasa">
      <div class="mode-option-title">jrxrezkyy Assistant</div>
      <div class="mode-option-desc">Mandu dashboard & obrolan santai</div>
    </div>
    <div class="mode-option ${currentMode==='dev'?'active':''}" data-mode="dev">
      <div class="mode-option-title">KYY Dev Assistant</div>
      <div class="mode-option-desc">Fokus bantu coding & debug</div>
    </div>
  `;
  dd.querySelectorAll('.mode-option').forEach(opt=>{
    opt.addEventListener('click', (e)=>{
      e.stopPropagation();
      currentMode = opt.dataset.mode;
      localStorage.setItem('jrx_chat_mode', currentMode);
      updateModelLabel();
      dd.remove();
    });
  });
  document.getElementById('modelSelectorBtn').appendChild(dd);
  setTimeout(()=>{ document.addEventListener('click', function h(e){ if(!e.target.closest('#modelSelectorBtn')){ dd.remove(); document.removeEventListener('click', h); } }); }, 0);
}

/* ================= SIDEBAR & PENGATURAN HANDLERS ================= */
function toggleSidebar(){
  const sb = document.getElementById('sidebar');
  const bd = document.getElementById('backdrop');
  if(isMobile()){
    sb.classList.toggle('open');
    bd.classList.toggle('show', sb.classList.contains('open'));
  } else {
    sb.classList.toggle('collapsed');
  }
}

function closeMobileSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('backdrop').classList.remove('show');
}

function openSettingsPopup(){
  const el = document.getElementById('settingsPopup');
  el.classList.add('show');
  requestAnimationFrame(()=>el.classList.add('visible'));
}

function closeSettingsPopup(e){
  if(e && e.target !== e.currentTarget) return;
  const el = document.getElementById('settingsPopup');
  el.classList.remove('visible');
  setTimeout(()=>el.classList.remove('show'), 200);
}

function autoGrow(el){
  el.style.height='auto';
  el.style.height=Math.min(el.scrollHeight,160)+'px';
}

function handleKey(e){
  if(e.key==='Enter' && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
}

function isMobile(){ return window.innerWidth <= 768; }

/* ================= CHAT LOGIC (INGATAN & DYNAMIC BACKEND) ================= */
/* ================= MEMORI LINTAS OBROLAN & MODE ================= */
async function getCrossSessionContext(limit = 40){
  if(currentUser){
    try{
      let query = supabaseClient
        .from('chat_history')
        .select('role,content,session_id,created_at')
        .eq('user_id', currentUser.id)
        .order('created_at', { ascending: false })
        .limit(limit);
      if(currentSessionId) query = query.neq('session_id', currentSessionId);

      const { data, error } = await query;
      if(error) throw error;
      return (data || []).reverse().map(m => ({ role: m.role, content: m.content }));
    }catch(err){
      console.warn('Gagal ambil memori lintas obrolan (login):', err);
      return [];
    }
  } else {
    const combined = [];
    guestSessions.forEach(s=>{
      if(s.id === currentSessionId) return;
      (s.messages || []).forEach(m => combined.push({ role: m.role, content: m.content, ts: m.ts || 0 }));
    });
    combined.sort((a,b)=> (a.ts||0) - (b.ts||0));
    return combined.slice(-limit).map(m => ({ role: m.role, content: m.content }));
  }
}

async function sendMessage(){
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if(!text || sending) return;

  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('chatInner').style.display = 'block';

  const isFirstMsg = messages.length === 0;
  messages.push({ role: 'user', content: text });
  input.value = '';
  autoGrow(input);
  renderMessages();
  scrollDown();

  if(isFirstMsg) await ensureSession(text);
  await persistMessage('user', text);

  sending = true;
  document.getElementById('sendBtn').disabled = true;

  const inner = document.getElementById('chatInner');
  const typingRow = document.createElement('div');
  typingRow.className = 'msg-row assistant';
  typingRow.id = 'typingRow';
  typingRow.innerHTML = `<div class="msg-bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
  inner.appendChild(typingRow);
  scrollDown();

  let replyText = '';
  try{
    // RUTE SERVERLESS BACKEND SESUAI MODE YANG DIPILIH
    const targetEndpoint = currentMode === 'dev' ? '/api/chat_2' : '/api/chat';

    // Gabung memori dari SEMUA obrolan/mode sebelumnya + obrolan yang sedang berjalan
    const crossContext = await getCrossSessionContext();
    const riwayatKirim = [...crossContext, ...messages];

    const res = await fetch(targetEndpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ 
        pesan: text, 
        riwayat: riwayatKirim, 
        mode: currentMode 
      })
    });

    const data = await res.json();
    document.getElementById('typingRow')?.remove();

    replyText = data.error ? '**Error:** ' + data.error : (data.balasan || '(tidak ada respons)');
  } catch(err){
    document.getElementById('typingRow')?.remove();
    replyText = '**Error koneksi:** ' + err.message;
  }

  messages.push({ role: 'assistant', content: replyText });
  await persistMessage('assistant', replyText);

  sending = false;
  document.getElementById('sendBtn').disabled = false;
  renderMessages();
  scrollDown();
}

function renderMessages(){
  const inner = document.getElementById('chatInner');
  inner.innerHTML = '';
  messages.forEach(m=>{
    const row = document.createElement('div');
    row.className = 'msg-row ' + m.role;
    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.innerHTML = m.role === 'user' ? m.content : marked.parse(m.content);
    row.appendChild(bubble);
    inner.appendChild(row);
  });
}

function scrollDown(){
  const area = document.getElementById('chatArea');
  area.scrollTop = area.scrollHeight;
}

/* ================= INIT ================= */
updateModelLabel();
applyProfileUI();
initAuth().then(loadHistoryForCurrentUser);
</script>

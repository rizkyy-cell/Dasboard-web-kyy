            mkdir -p "$RES/mipmap-$n"
            convert ic512.png -resize ${sz}x${sz} "$RES/mipmap-$n/ic_launcher.png"
            cp "$RES/mipmap-$n/ic_launcher.png" "$RES/mipmap-$n/ic_launcher_round.png"
          done

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Siapkan file APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk KYY-Sticker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KYY-Sticker-apk
          path: KYY-Sticker.apk

      - name: Publikasikan ke Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-terbaru
          name: KYY Sticker APK (terbaru)
          files: KYY-Sticker.apk
          make_latest: true

:root{color-scheme:light;--bg:#f4f4f2;--sf:#ffffff;--bd:#e5e4e0;--tx:#1a1a1a;--mu:#6f6e6a;--ac:#F4A81E;--acx:#9a5b00;--on:#1c1202;--er:#dc2626;--scrim:rgba(12,12,12,.42);--ng:rgba(255,255,255,.62);--nb:rgba(255,255,255,.8);
--act:color-mix(in srgb,var(--ac) 14%,var(--sf));
--ease:cubic-bezier(.22,.8,.3,1);--spring:cubic-bezier(.3,1.35,.5,1);
--r1:8px;--r2:12px;--rp:999px;--f1:12px;--f2:14px;--f3:16px;--f5:26px;--s1:4px;--s2:8px;--s3:12px;--s4:16px}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#0e0e0e;--sf:#171717;--bd:#2a2a2a;--tx:#ececec;--mu:#8f8f8f;--ac:#F4A81E;--acx:#F4A81E;--on:#1c1202;--er:#f26b63;--scrim:rgba(0,0,0,.6);--ng:rgba(34,34,34,.6);--nb:rgba(255,255,255,.1)}}
:root[data-theme=dark]{color-scheme:dark;--bg:#0e0e0e;--sf:#171717;--bd:#2a2a2a;--tx:#ececec;--mu:#8f8f8f;--ac:#F4A81E;--acx:#F4A81E;--on:#1c1202;--er:#f26b63;--scrim:rgba(0,0,0,.6);--ng:rgba(34,34,34,.6);--nb:rgba(255,255,255,.1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
::selection{background:color-mix(in srgb,var(--ac) 28%,transparent)}
button,input{font-family:inherit;font-size:inherit}
button{cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input:focus-visible,.sel:focus-visible{outline:0}
body{margin:0;font:15px/1.45 "Instrument Sans",system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;-webkit-font-smoothing:antialiased}
body.lk{overflow:hidden}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
header,main{max-width:520px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;padding:calc(18px + env(safe-area-inset-top)) var(--s4) 6px}
.app{font-size:var(--f1);color:var(--mu)}
h1{margin:2px 0 0;font-size:var(--f5);font-weight:700;letter-spacing:-.01em}
h3{margin:0 0 6px;font-size:18px}
h4{margin:24px 0 8px;font-size:13px;font-weight:600;color:var(--mu)}
main{padding:var(--s2) var(--s4) 120px}
main.tin{animation:tin .2s var(--ease)}
.mu{color:var(--mu)}.lw{color:var(--er)!important;font-weight:600}.ac{color:var(--acx)!important}
.date{margin:2px 0 var(--s3);color:var(--mu)}
.ib{width:40px;height:40px;border-radius:var(--r2);border:1px solid var(--bd);background:var(--sf);color:var(--tx);display:grid;place-items:center;padding:0;flex:none;transition:transform .2s var(--ease),background .2s}
.ib:active{transform:scale(.92)}.ib.sm{width:34px;height:34px;border-radius:10px}
.ib.cog svg{transition:transform .5s var(--ease)}@media(hover:hover){.ib.cog:hover svg{transform:rotate(60deg)}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.c{padding:var(--s3) 14px;border-radius:var(--r2);background:var(--sf);border:1px solid var(--bd)}
.c small{display:block;color:var(--mu);font-size:var(--f1);margin-bottom:2px}
.c b{font-size:var(--f3);font-weight:650;font-variant-numeric:tabular-nums}
.grp{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r2);overflow:hidden}
.r{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:var(--s3) 14px;border-top:1px solid var(--bd);transition:background .2s,transform .2s var(--ease);overflow:hidden}
.r:first-child{border-top:0}
.r small{display:block;color:var(--mu);font-size:var(--f1)}
.r>div:first-child{min-width:0}.r b{font-variant-numeric:tabular-nums}
.rt{text-align:right;flex:none}
.r[data-a]{cursor:pointer}.r[data-a]:active{background:var(--act)}
.r.dis{opacity:.45;pointer-events:none}
.mr{justify-content:flex-start;gap:var(--s3)}.mr>div:nth-child(2){flex:1}.mr .ic{color:var(--mu)}
.mr .bx{width:36px;height:36px;border-radius:10px;border:1px solid var(--bd);display:grid;place-items:center;flex:none;color:var(--tx)}
.mr.dn b,.mr.dn .bx{color:var(--er)}
.tag{display:inline-block;font-size:11px;font-weight:600;color:var(--er);border:1px solid var(--er);border-radius:6px;padding:0 6px;margin-left:4px;font-style:normal;line-height:18px}

const blank=()=>({v:2,items:[],parties:[],notas:[],rets:[],pays:[],adj:[],seq:{out:0,in:0}});
function norm(r){const b=blank();['items','parties','notas','rets','pays','adj'].forEach(k=>{b[k]=Array.isArray(r[k])?r[k]:[]});b.seq={out:+(r.seq&&r.seq.out)||0,in:+(r.seq&&r.seq.in)||0};
 b.notas.forEach(n=>{n.lines=Array.isArray(n.lines)?n.lines:[];n.dp=+n.dp||0;n.ts=+n.ts||0});
 b.parties.forEach(p=>{p.k=p.k||'c'});
 b.items.forEach(x=>{x.kind=KU[x.kind]?x.kind:'umum';x.a=x.a||{};if((x.kind||'')==='stang'){x.name=String(x.name||'').replace(/stang seger/gi,'Stang seher');if(x.base)x.base=String(x.base).replace(/stang seger/gi,'Stang seher')}
  x.base=x.base||x.name;x.cat=x.cat||'';x.codes=Array.isArray(x.codes)?x.codes.map(String):[];x.pc=x.pc||''});return b}
function migrate(o){const n=blank(),items=Array.isArray(o.items)?o.items:[],moves=Array.isArray(o.moves)?o.moves:[],pays=Array.isArray(o.pays)?o.pays:[];
 const pmap={},party=name=>{name=String(name||'').trim();if(!name||name.toLowerCase()==='umum')return null;const k=name.toLowerCase();if(!pmap[k]){pmap[k]={id:uid(),k:'c',name,phone:'',ts:Date.now()};n.parties.push(pmap[k])}return pmap[k].id};
 const flow={};let minD=today();
 moves.forEach((m,ix)=>{const t=m.t==='in'?'in':'out',q=+m.q||0,p=+m.p||0;flow[m.i]=(flow[m.i]||0)+(t==='in'?q:-q);n.seq[t]++;if(m.d&&m.d<minD)minD=m.d;
  n.notas.push({id:m.id||uid(),no:n.seq[t],t,d:m.d||today(),ts:ix+1,partyId:t==='out'?party(m.who):null,lines:[{i:m.i,name:m.n,unit:m.u,q,p,c:m.c!=null?+m.c:p}],dp:(t==='in'||m.paid)?q*p:0,note:m.note||'',void:false})});
 items.forEach(x=>{n.items.push({id:x.id,kind:'umum',base:x.name,a:{},name:x.name,cat:x.cat||'',unit:x.unit||'pcs',buy:+x.buy||0,sell:+x.sell||0,min:+x.min||0,arch:false});
  const open=r4((+x.stock||0)-(flow[x.id]||0));
  if(open!==0)n.adj.push({id:uid(),i:x.id,name:x.name,unit:x.unit,delta:open,c:open>0?(+x.buy||0):null,reason:'Saldo awal',d:minD,ts:0,note:'Hasil migrasi data lama'})});
 pays.forEach((p,ix)=>{const pid=party(p.who);if(pid)n.pays.push({id:p.id||uid(),partyId:pid,notaId:null,a:+p.a||0,d:p.d||today(),ts:ix+1,note:''})});
 return n}
function load(){let r=null;try{r=JSON.parse(localStorage.getItem(K2))}catch(e){}
 if(r&&r.v===2&&Array.isArray(r.items))return norm(r);
 try{const o=JSON.parse(localStorage.getItem(K1));if(o&&Array.isArray(o.items))return migrate(o)}catch(e){}
 return blank()}

/* ================= Mesin stok & biaya (diturunkan dari riwayat) ================= */
function events(dd){const ev=[];let o=0;
 dd.notas.forEach(n=>{if(n.void)return;n.lines.forEach(l=>ev.push({k:n.t,i:l.i,q:l.q,p:l.p,d:n.d,ts:n.ts,o:o++,ref:n}))});
 const nm={};dd.notas.forEach(n=>{nm[n.id]=n});
 dd.rets.forEach(r=>{const n=nm[r.notaId];if(!n||n.void)return;r.lines.forEach(l=>ev.push({k:n.t==='out'?'rout':'rin',i:l.i,q:l.q,p:l.p,d:r.d,ts:r.ts,o:o++,ref:r}))});
 dd.adj.forEach(a=>ev.push({k:'adj',i:a.i,q:a.delta,p:a.c,d:a.d,ts:a.ts,o:o++,ref:a}));
 ev.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:(a.ts-b.ts)||(a.o-b.o));return ev}
function step(s,e){
 if(e.k==='in'||(e.k==='adj'&&e.q>0&&e.p!=null)){const q=Math.abs(e.q),nq=s.q+q;s.a=s.q>0?(s.q*s.a+q*e.p)/nq:e.p;s.q=nq}
 else if(e.k==='out'||e.k==='rin')s.q-=e.q;
 else if(e.k==='rout')s.q+=e.q;
 else if(e.k==='adj')s.q+=e.q}
function calc(dd){const S={};events(dd).forEach(e=>{step(S[e.i]||(S[e.i]={q:0,a:0}),e)});
 const stock={},avg={};Object.keys(S).forEach(k=>{stock[k]=r4(S[k].q);avg[k]=S[k].a});return{stock,avg}}
const cc=()=>C||(C=calc(D));
function ledger(id){const s={q:0,a:0},out=[];events(D).forEach(e=>{if(e.i!==id)return;step(s,e);out.push({e,bal:r4(s.q)})});return out.reverse()}
function tryApply(fn){const c=clone(D),b=calc(D);fn(c);const a=calc(c);
 for(const it of c.items){const s=a.stock[it.id]||0;if(s<-1e-9&&s<(b.stock[it.id]||0)-1e-9)return{ok:false,item:it,stock:s}}
 return{ok:true,data:c}}

const itm=id=>D.items.find(x=>x.id===id),nOf=id=>D.notas.find(n=>n.id===id),pOf=id=>D.parties.find(p=>p.id===id);
const partyName=id=>id?((pOf(id)||{}).name||'(dihapus)'):'Umum';
const nno=n=>(n.t==='out'?'J-':'M-')+pad(n.no,4);
const nTotal=n=>n.lines.reduce((s,l)=>s+l.q*l.p,0);
const retsOf=id=>D.rets.filter(r=>r.notaId===id);
const retVal=r=>r.lines.reduce((s,l)=>s+l.q*l.p,0);
function nBase(n,dd){dd=dd||D;const rs=dd.rets.filter(r=>r.notaId===n.id);return nTotal(n)-rs.reduce((s,r)=>s+retVal(r),0)-n.dp+rs.reduce((s,r)=>s+(r.refund||0),0)}
function alloc(pid,dd){dd=dd||D;
 const ns=dd.notas.filter(n=>!n.void&&n.t==='out'&&n.partyId===pid).sort(byDT),row={};
 ns.forEach(n=>{row[n.id]={n,base:nBase(n,dd),out:0,paid:0}});let pool=0;
 ns.forEach(n=>{const r=row[n.id];if(r.base<0)pool+=-r.base;r.out=Math.max(r.base,0)});
 dd.pays.filter(p=>p.partyId===pid).sort(byDT).forEach(p=>{let a=p.a;const r=p.notaId&&row[p.notaId];if(r){const t=Math.min(a,r.out);r.out-=t;r.paid+=t;a-=t}pool+=a});
 ns.forEach(n=>{const r=row[n.id];if(pool>0&&r.out>0){const t=Math.min(pool,r.out);r.out-=t;r.paid+=t;pool-=t}});
 const rows=ns.map(n=>{const r=row[n.id];r.out=r.out<0.5?0:r2(r.out);return r});
 const debt=r2(rows.reduce((s,r)=>s+r.out,0));return{rows,debt,credit:pool<0.5?0:r2(pool)}}
const al=pid=>AL[pid]||(AL[pid]=alloc(pid));
const rowOf=n=>n.partyId?al(n.partyId).rows.find(r=>r.n.id===n.id):null;
function inPer(p,d){const t=today();return p==='all'||(p==='today'&&d===t)||(p==='7'&&d>=addDays(t,-6))||(p==='month'&&d.slice(0,7)===t.slice(0,7))}
const PERS=[['today','Hari ini'],['7','7 hari'],['month','Bulan ini'],['all','Semua']];
const debtors=()=>D.parties.filter(p=>p.k==='c').map(p=>({p,a:al(p.id)}));
const retLeft=n=>{const rs=retsOf(n.id);return n.lines.map(l=>({l,max:r4(l.q-rs.reduce((s,r)=>s+r.lines.filter(x=>x.i===l.i).reduce((t,x)=>t+x.q,0),0))}))};
function stats(p){let om=0,lb=0,cnt=0,beli=0,ret=0;const top={},day={};
 D.notas.forEach(n=>{if(n.void||!inPer(p,n.d))return;
  if(n.t==='out'){cnt++;n.lines.forEach(l=>{const v=l.q*l.p;om+=v;lb+=l.q*(l.p-l.c);day[n.d]=(day[n.d]||0)+v;const t=top[l.i]||(top[l.i]={name:l.name,unit:l.unit,q:0,v:0});t.q+=l.q;t.v+=v})}else beli+=nTotal(n)});
 D.rets.forEach(r=>{const n=nOf(r.notaId);if(!n||n.void||!inPer(p,r.d))return;
  if(n.t==='out'){const v=retVal(r);om-=v;ret+=v;day[r.d]=(day[r.d]||0)-v;lb-=r.lines.reduce((s,l)=>s+l.q*(l.p-l.c),0);r.lines.forEach(l=>{const t=top[l.i];if(t){t.q-=l.q;t.v-=l.q*l.p}})}else beli-=retVal(r)});
 return{om,lb,cnt,beli,ret,top:Object.values(top).filter(t=>t.q>0).sort((a,b)=>b.q-a.q),days:Object.entries(day).sort((a,b)=>a[0]<b[0]?1:-1)}}

/* ================= Barang: jenis, nama otomatis, deteksi duplikat ================= */
const nk=s=>String(s||'').toLowerCase().replace(/\s+/g,' ').trim();
function normOS(s){s=String(s||'').trim().replace(/^os\s*/i,'').toUpperCase();if(/^(STD|STANDAR|STANDARD|0+)$/.test(s))return'STD';return s}
const fOf=v=>({base:String(v.base||'').trim().replace(/\s+/g,' '),os:normOS(v.os),seri:String(v.seri||'').trim().toUpperCase(),jenis:String(v.jenis||'').trim(),versi:String(v.versi||'').trim()});
const BDIM={6000:[10,26,8],6001:[12,28,8],6002:[15,32,9],6003:[17,35,10],6004:[20,42,12],6005:[25,47,12],6006:[30,55,13],
6200:[10,30,9],6201:[12,32,10],6202:[15,35,11],6203:[17,40,12],6204:[20,47,14],6205:[25,52,15],6206:[30,62,16],6207:[35,72,17],6208:[40,80,18],
6300:[10,35,11],6301:[12,37,12],6302:[15,42,13],6303:[17,47,14],6304:[20,52,15],6305:[25,62,17],6306:[30,72,19],6307:[35,80,21]};
function bdim(seri){const m=String(seri||'').match(/(?:^|[^0-9])(6[023]\d\d)(?!\d)/),d=m&&BDIM[+m[1]];return d?d[0]+' × '+d[1]+' × '+d[2]:''}
const bdimTxt=s=>{const d=bdim(s);return d?'Ukuran standar '+d+' mm (dalam × luar × tebal)':''};
const fK=(k,v)=>{const f=fOf(v);if(k==='bearing'&&!f.base)f.base='Laher';return f};
function compose(k,f){if(!f.base)return'';
 if(k==='piston')return f.base+(f.os?(f.os==='STD'?' STD':' OS '+f.os):'');
 if(k==='bearing')return f.base+(f.seri?' '+f.seri:'');
 if(k==='stang')return f.base+(f.jenis?' '+f.jenis:'')+(f.versi?' ('+f.versi+')':'');
 return f.base}
function keyOf(k,f){if(k==='piston')return[k,nk(f.base),nk(f.os)].join('|');if(k==='bearing')return[k,nk(f.base),nk(f.seri)].join('|');if(k==='stang')return[k,nk(f.base),nk(f.jenis),nk(f.versi)].join('|');return[k,nk(f.base)].join('|')}
const itemF=x=>({base:x.base||x.name,os:(x.a||{}).os||'',seri:(x.a||{}).seri||'',jenis:(x.a||{}).jenis||'',versi:(x.a||{}).versi||''});
const kindOf=x=>x.kind||'umum';
const findDup=(k,f,exceptId)=>D.items.find(x=>x.id!==exceptId&&kindOf(x)===k&&keyOf(k,itemF(x))===keyOf(k,f));
const perr=(sel,msg)=>({ok:false,sel,msg});
const cn=s=>String(s||'').trim().toUpperCase();
const parseCodes=s=>{const o=[];String(s||'').split(/[\s,;]+/).forEach(c=>{c=c.trim();if(c&&!o.some(z=>cn(z)===cn(c)))o.push(c)});return o};
const codeOwner=(c,ex)=>D.items.find(x=>x.id!==ex&&(x.codes||[]).some(z=>cn(z)===cn(c)));
function codeErr(codes,ex,pc){{const o=pcOwner(pc,ex);if(o)return perr('[name=pc]','Kode pabrik '+pc+' sudah dipakai '+o.name)}
 for(const c of codes){const o=codeOwner(c,ex);if(o)return perr('[name=codes]','Kode '+c+' sudah dipakai '+o.name)}return null}
const pcOwner=(c,ex)=>c?D.items.find(x=>x.id!==ex&&kindOf(x)==='piston'&&x.pc&&cn(x.pc)===cn(c)):null;
const findByCode=code=>{const c=cn(code);return D.items.find(x=>(x.codes||[]).some(z=>cn(z)===c))||D.items.find(x=>x.pc&&cn(x.pc)===c)};
function checkProd(k,v){const f=fK(k,v);
 if(!f.base)return perr('[name=base]','Isi nama barang');
 if(k==='piston'&&!f.os)return perr('[name=os]','Isi oversize piston (STD jika standar)');
 if(k==='bearing'&&!f.seri)return perr('[name=seri]','Isi seri barang');
 const unit=k==='umum'?String(v.unit||'').trim():KU[k];if(!unit)return perr('[name=unit]','Isi satuan');
 const sell=pm(v.sell);if(!(sell>0))return perr('[name=sell]','Isi harga jual');
 const buy=0,min=0;
 return{ok:true,f,unit,sell,buy,min,cat:k==='umum'?String(v.cat||'').trim():'',codes:parseCodes(v.codes),pc:String(v.pc||'').trim()}}
const attrsOf=f=>({os:f.os,seri:f.seri,jenis:f.jenis,versi:f.versi});
function saveProduct(k,v){const p=checkProd(k,v);if(!p.ok)return p;
 const q=(v.q===''||v.q==null)?0:pq(v.q);if(!(q>=0))return perr('[name=q]','Jumlah tidak valid');
 const c=clone(D),dup=findDup(k,p.f),at=Date.now();let id;
 {const ce=codeErr(p.codes,dup?dup.id:null,k==='piston'?p.pc:'');if(ce)return ce}
 if(dup){if(!(q>0))return perr('[name=q]','Isi jumlah barang yang masuk');
  const x=c.items.find(z=>z.id===dup.id);x.codes=(x.codes||[]).concat(p.codes.filter(z=>!(x.codes||[]).some(y=>cn(y)===cn(z))));if(p.pc)x.pc=p.pc;x.sell=p.sell;if(p.buy>0)x.buy=p.buy;x.arch=false;x.min=p.min;id=x.id;
  c.adj.push({id:uid(),i:id,name:x.name,unit:x.unit,delta:q,c:p.buy>0?p.buy:null,reason:'Stok masuk',d:today(),ts:at,note:''})}
 else{const x={id:uid(),kind:k,base:p.f.base,a:attrsOf(p.f),name:compose(k,p.f),cat:p.cat,unit:p.unit,buy:p.buy,sell:p.sell,min:p.min,arch:false,codes:p.codes,pc:p.pc};c.items.push(x);id=x.id;
  if(q>0)c.adj.push({id:uid(),i:id,name:x.name,unit:x.unit,delta:q,c:p.buy>0?p.buy:null,reason:'Stok awal',d:today(),ts:at,note:''})}
 if(!commit(c))return{ok:false,msg:'Gagal menyimpan'};fresh=id;return{ok:true,id,merged:!!dup,q}}
function updateProduct(id,k,v){const p=checkProd(k,v);if(!p.ok)return p;
 if(findDup(k,p.f,id))return perr('[name=base]','Barang dengan data yang sama sudah ada');
 {const ce=codeErr(p.codes,id,k==='piston'?p.pc:'');if(ce)return ce}
 const c=clone(D),x=c.items.find(z=>z.id===id);if(!x)return perr('','Barang tidak ditemukan');
 x.base=p.f.base;x.a=attrsOf(p.f);x.name=compose(k,p.f);x.cat=p.cat;if(k==='umum')x.unit=p.unit;x.sell=p.sell;x.min=p.min;x.codes=p.codes;x.pc=p.pc;if(p.buy>0)x.buy=p.buy;
 if(!commit(c))return{ok:false,msg:'Gagal menyimpan'};fresh=id;return{ok:true,id}}

/* Ganti suara: Pengaturan > Suara scan > pilih file audio (mp3, wav, ogg, m4a; maks 300 KB).
   Atau ganti nilai SND.ok dan SND.no di atas dengan data:audio/...;base64,... milik Anda. */
const SNDK={ok:'bm_snd_ok',no:'bm_snd_no'},AUD={};
const sndOn=()=>{try{return localStorage.getItem('bm_snd')!=='0'}catch(e){return true}};
const sndName=k=>{try{return localStorage.getItem(SNDK[k]+'_n')||''}catch(e){return''}};
function sndSrc(k){try{return localStorage.getItem(SNDK[k])||SND[k]}catch(e){return SND[k]}}
function synth(ok){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const t=AC.currentTime;if(ok)tone(1760,t,.11,.16);else{tone(330,t,.12,.16);tone(247,t+.16,.18,.16)}}catch(e){}}
function tone(f,t0,d,v){const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+.01);g.gain.exponentialRampToValueAtTime(0.0001,t0+d);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d+.03)}
function playSnd(k){const src=sndSrc(k);let a=AUD[k];if(!a||a.dataset.s!==src){a=new Audio(src);a.preload='auto';a.dataset.s=src;AUD[k]=a}
 try{a.currentTime=0}catch(e){}try{const pr=a.play();if(pr&&pr.catch)pr.catch(()=>synth(k==='ok'))}catch(e){synth(k==='ok')}}
function ping(ok){try{if(navigator.vibrate)navigator.vibrate(ok?40:[60,50,60])}catch(e){}if(!sndOn())return;playSnd(ok?'ok':'no')}
function suggestFromCode(code){const c=cn(code),m=c.match(/^([A-Z0-9]+)-([A-Z0-9]+)-([A-Z])$/);if(!m)return null;
 const OSL={B:'25',C:'50',D:'75',E:'100'},fam=m[1]+'-'+m[2],sib=D.items.filter(x=>x.pc&&cn(x.pc).indexOf(fam+'-')===0&&cn(x.pc)!==c),s=sib[0];
 return{fam,os:OSL[m[3]]||'',sib,base:s?(s.base||s.name):'',kind:s?kindOf(s):'piston'}}
function scIdle(){return '<p class="hint" style="text-align:center;margin-top:14px">'+(SC&&SC.ctx==='field'?'Arahkan kamera ke stiker paket piston. Tulisan dan QR dibaca otomatis.':'Arahkan kamera ke stiker atau tulisan di kotak. Tulisan dan QR dibaca otomatis.')+'</p>'}

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Builder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background-color: #0a0a0a; color: #e5e5e5; font-family: sans-serif; }
    .card-bg { background-color: #121212; border: 1px solid #262626; }
  </style>
</head>
<body class="min-h-screen p-4 flex justify-center items-start">

  <div class="w-full max-w-md space-y-6 my-6">
    <div>
      <p class="text-xs uppercase tracking-widest text-zinc-500 font-semibold">Website Builder</p>
      <h1 class="text-3xl font-serif font-bold text-white mt-1">Build your website</h1>
    </div>

    <!-- Card 1: Website Name / Slug -->
    <div class="card-bg p-5 rounded-2xl space-y-3">
      <label class="block text-sm font-medium text-zinc-300">Website name</label>
      <div class="relative">
        <input type="text" id="slugInput" placeholder="ForAraa" 
               class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-zinc-500 text-sm">
        <span id="slugStatus" class="hidden absolute right-3 top-3 text-xs font-semibold px-2 py-1 rounded bg-emerald-950 text-emerald-400 border border-emerald-800">
          Available
        </span>
      </div>
      <p class="text-xs text-zinc-500">yoursite.vercel.app/<span id="slugPreview" class="text-zinc-400">your-name</span></p>
    </div>

    <!-- Card 2: Song Cover -->
    <div class="card-bg p-5 rounded-2xl space-y-3">
      <label class="block text-sm font-medium text-zinc-300">Song cover</label>
      <div id="coverBox" onclick="document.getElementById('coverInput').click()" 
           class="relative aspect-square w-full bg-zinc-900 border border-dashed border-zinc-800 rounded-xl flex flex-col justify-center items-center cursor-pointer overflow-hidden group">
        <input type="file" id="coverInput" accept="image/*" class="hidden" onchange="handleCoverSelect(event)">
        <div id="coverPlaceholder" class="text-center p-4">
          <span class="text-xs bg-zinc-800 text-zinc-300 px-3 py-1 rounded-md">Cover</span>
          <p class="text-xs text-zinc-500 mt-2">Ketuk untuk upload foto sampul</p>
        </div>
        <img id="coverPreview" class="hidden w-full h-full object-cover">
      </div>
    </div>

    <!-- Card 3: Gallery Photos -->
    <div class="card-bg p-5 rounded-2xl space-y-3">
      <div class="flex justify-between items-center">
        <label class="block text-sm font-medium text-zinc-300">Gallery photos</label>
        <span id="galleryCounter" class="text-xs text-zinc-500 font-mono">0/10</span>
      </div>
      
      <div class="grid grid-cols-3 gap-2" id="galleryGrid"></div>
      <input type="file" id="galleryInput" accept="image/*" class="hidden" onchange="handleGallerySelect(event)">
    </div>

    <!-- Generate Button -->
    <button id="generateBtn" disabled 
            class="w-full bg-zinc-800 text-zinc-500 font-semibold py-4 rounded-xl text-sm transition-all duration-200">
      Generate website
    </button>
  </div>

  <!-- Modal Success -->
  <div id="successModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex justify-center items-center p-4 hidden z-50">
    <div class="card-bg p-6 rounded-2xl w-full max-w-sm text-center space-y-5 border border-zinc-800">
      <div class="w-12 h-12 bg-emerald-500/10 text-emerald-500 rounded-full flex items-center justify-center mx-auto border border-emerald-500/20 text-xl">
        ✓
      </div>
      <div>
        <h3 class="text-lg font-bold text-white">Website created successfully</h3>
        <p class="text-xs text-zinc-400 mt-1">Your site is live and ready to share.</p>
      </div>
      
      <div class="bg-zinc-900 border border-zinc-800 p-3 rounded-xl text-xs font-mono text-zinc-300 break-all" id="resultUrl">
        https://yoursite.vercel.app/your-name
      </div>

      <div class="space-y-2">
        <button id="copyBtn" class="w-full bg-zinc-800 hover:bg-zinc-700 text-white font-medium py-3 rounded-xl text-sm">
          Copy link
        </button>
        <a id="openBtn" href="#" target="_blank" class="block w-full bg-white text-black font-semibold py-3 rounded-xl text-sm">
          Open website
        </a>
      </div>
    </div>
  </div>

  <!-- SELURUH JAVASCRIPT DISATUKAN DI SINI -->
  <script>
    let supabase = null;
    let selectedCover = null;
    let selectedGallery = new Array(10).fill(null);
    let activeGalleryIndex = null;

    const slugInput = document.getElementById("slugInput");
    const slugStatus = document.getElementById("slugStatus");
    const slugPreview = document.getElementById("slugPreview");
    const coverPreview = document.getElementById("coverPreview");
    const coverPlaceholder = document.getElementById("coverPlaceholder");
    const galleryGrid = document.getElementById("galleryGrid");
    const galleryCounter = document.getElementById("galleryCounter");
    const generateBtn = document.getElementById("generateBtn");
    const successModal = document.getElementById("successModal");
    const resultUrl = document.getElementById("resultUrl");
    const copyBtn = document.getElementById("copyBtn");
    const openBtn = document.getElementById("openBtn");

    async function initSupabase() {
      try {
        const res = await fetch("/api/config");
        const config = await res.json();
        if (!config.supabaseUrl || !config.supabaseAnonKey) return;
        supabase = window.supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);
      } catch (err) {
        console.error("Gagal load config:", err);
      }
    }

    function renderGalleryGrid() {
      galleryGrid.innerHTML = "";
      let filledCount = 0;

      selectedGallery.forEach((item, index) => {
        if (item) filledCount++;
        const slot = document.createElement("div");
        slot.className = "relative aspect-square bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden flex flex-col justify-center items-center cursor-pointer group";

        if (item) {
          slot.innerHTML = `
            <img src="${item.preview}" class="w-full h-full object-cover">
            <button onclick="removeGalleryImage(event, ${index})" class="absolute top-1 right-1 bg-black/60 text-white w-5 h-5 rounded-full flex items-center justify-center text-xs z-10">✕</button>
          `;
        } else {
          slot.innerHTML = `<span class="text-[10px] text-zinc-500 font-mono">Photo ${index + 1}</span>`;
          slot.onclick = () => {
            activeGalleryIndex = index;
            document.getElementById("galleryInput").click();
          };
        }
        galleryGrid.appendChild(slot);
      });

      galleryCounter.innerText = `${filledCount}/10`;
      checkFormValidity();
    }

    slugInput.addEventListener("input", async (e) => {
      const val = e.target.value.trim().toLowerCase().replace(/[^a-z0-9-]/g, "-");
      slugInput.value = val;
      slugPreview.innerText = val || "your-name";

      if (!val) {
        slugStatus.classList.add("hidden");
        checkFormValidity();
        return;
      }
      if (!supabase) return;

      const { data } = await supabase.from("sites").select("slug").eq("slug", val).maybeSingle();
      if (!data) {
        slugStatus.classList.remove("hidden");
        slugStatus.innerText = "Available";
        slugStatus.className = "absolute right-3 top-3 text-xs font-semibold px-2 py-1 rounded bg-emerald-950 text-emerald-400 border border-emerald-800";
      } else {
        slugStatus.classList.remove("hidden");
        slugStatus.innerText = "Taken";
        slugStatus.className = "absolute right-3 top-3 text-xs font-semibold px-2 py-1 rounded bg-rose-950 text-rose-400 border border-rose-800";
      }
      checkFormValidity();
    });

    window.handleCoverSelect = (e) => {
      const file = e.target.files[0];
      if (file) {
        selectedCover = file;
        coverPreview.src = URL.createObjectURL(file);
        coverPreview.classList.remove("hidden");
        coverPlaceholder.classList.add("hidden");
        checkFormValidity();
      }
    };

    window.handleGallerySelect = (e) => {
      const file = e.target.files[0];
      if (file && activeGalleryIndex !== null) {
        selectedGallery[activeGalleryIndex] = {
          file: file,
          preview: URL.createObjectURL(file)
        };
        activeGalleryIndex = null;
        e.target.value = ""; // Reset file picker
        renderGalleryGrid();
      }
    };

    window.removeGalleryImage = (e, index) => {
      e.stopPropagation();
      selectedGallery[index] = null;
      renderGalleryGrid();
    };

    function checkFormValidity() {
      const isSlugValid = slugInput.value.trim().length > 0 && slugStatus.innerText === "Available";
      const isGalleryFull = selectedGallery.every(item => item !== null);

      if (isSlugValid && selectedCover && isGalleryFull) {
        generateBtn.disabled = false;
        generateBtn.className = "w-full bg-white hover:bg-zinc-200 text-black font-semibold py-4 rounded-xl text-sm transition-all duration-200 cursor-pointer";
      } else {
        generateBtn.disabled = true;
        generateBtn.className = "w-full bg-zinc-800 text-zinc-500 font-semibold py-4 rounded-xl text-sm transition-all duration-200";
      }
    }

    generateBtn.onclick = async () => {
      if (!supabase) return alert("Koneksi Supabase gagal!");
      generateBtn.disabled = true;
      const slug = slugInput.value.trim();

      try {
        generateBtn.innerText = "Uploading cover...";
        const coverPath = `${slug}/cover_${Date.now()}.${selectedCover.name.split('.').pop()}`;
        await supabase.storage.from("uploads").upload(coverPath, selectedCover);
        const coverUrl = supabase.storage.from("uploads").getPublicUrl(coverPath).data.publicUrl;

        const galleryUrls = [];
        for (let i = 0; i < selectedGallery.length; i++) {
          generateBtn.innerText = `Uploading gallery (${i + 1}/10)...`;
          const file = selectedGallery[i].file;
          const path = `${slug}/gallery_${i}_${Date.now()}.${file.name.split('.').pop()}`;
          await supabase.storage.from("uploads").upload(path, file);
          galleryUrls.push(supabase.storage.from("uploads").getPublicUrl(path).data.publicUrl);
        }

        generateBtn.innerText = "Saving your website...";
        const { error } = await supabase.from("sites").insert([{ slug, cover_url: coverUrl, gallery_urls: galleryUrls }]);
        if (error) throw error;

        const fullUrl = `${window.location.origin}/${slug}`;
        resultUrl.innerText = fullUrl;
        openBtn.href = fullUrl;
        successModal.classList.remove("hidden");
      } catch (err) {
        alert("Error: " + err.message);
      } finally {
        generateBtn.innerText = "Generate website";
        checkFormValidity();
      }
    };

    copyBtn.onclick = () => {
      navigator.clipboard.writeText(resultUrl.innerText);
      copyBtn.innerText = "Copied!";
      setTimeout(() => copyBtn.innerText = "Copy link", 2000);
    };

    initSupabase();
    renderGalleryGrid();
  </script>
</body>
</html>

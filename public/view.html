<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About You</title>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #0d0d0d; color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; min-height: 100vh; padding: 16px 16px 112px;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    }
    .italic-serif { font-family: Georgia, "Times New Roman", serif; font-style: italic; }

    #mainContent { width: 100%; max-width: 380px; margin: auto 0; padding-top: 24px; text-align: center; }

    .photo-card { background-color: #141414; border: 1px solid #262626; padding: 12px; border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(0,0,0,.6); position: relative; }
    .photo-frame { position: relative; aspect-ratio: 1/1; width: 100%; border-radius: 14px; overflow: hidden; background: #18181b; }
    #galleryImg { width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity .3s ease; opacity: 0; }
    #galleryImg.show { opacity: 1; }
    #loadingText { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px; font-size: 12px; color: #71717a; font-family: monospace; }
    #loadingText.hidden { display: none; }

    .lyric-box { min-height: 60px; display: flex; align-items: center; justify-content: center; padding: 0 16px; margin-top: 24px; }
    #lyricText { font-size: 20px; color: #d4d4d8; margin: 0; transition: all .3s ease; }

    .player-bar {
      position: fixed; bottom: 16px; left: 16px; right: 16px; max-width: 420px; margin: 0 auto;
      background-color: rgba(24,24,27,.9); backdrop-filter: blur(8px); border: 1px solid #27272a;
      padding: 12px; border-radius: 18px; display: flex; align-items: center; gap: 12px;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,.5);
    }
    #playerCover { width: 48px; height: 48px; border-radius: 10px; object-fit: cover; background: #27272a; flex-shrink: 0; }
    .song-info { flex: 1; min-width: 0; text-align: left; }
    .song-title { font-size: 12px; font-weight: 600; color: #fff; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .song-artist { font-size: 10px; color: #a1a1aa; margin: 2px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .progress-track { width: 100%; background: #27272a; height: 4px; border-radius: 999px; margin-top: 8px; overflow: hidden; }
    #progressBar { background: #fff; height: 100%; width: 0%; transition: width .2s linear; }
    #playBtn {
      width: 40px; height: 40px; background: #fff; color: #000; border: none; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; flex-shrink: 0; cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Main Container -->
  <div id="mainContent">

    <!-- Photo Display Box -->
    <div class="photo-card">
      <div class="photo-frame">
        <img id="galleryImg" src="" alt="Gallery">
        <div id="loadingText">Loading memories...</div>
      </div>
    </div>

    <!-- Lyrics Display Box -->
    <div class="lyric-box">
      <p id="lyricText" class="italic-serif">"Press play to start..."</p>
    </div>

  </div>

  <!-- Audio Player Floating Bar -->
  <div class="player-bar">
    <img id="playerCover" src="">
    <div class="song-info">
      <h4 class="song-title">Merry Christmas, Please Don't Call</h4>
      <p class="song-artist">Bleach-Ears</p>
      <div class="progress-track"><div id="progressBar"></div></div>
    </div>
    <button id="playBtn">▶</button>
  </div>

  <!-- Audio Element -->
  <audio id="bgAudio" src="/audio.mp3" preload="auto"></audio>

  <!-- Debug Panel (sementara, buat lacak kenapa foto gak muncul) -->
  <div id="debugPanel" style="position:fixed; top:0; left:0; right:0; max-height:38vh; overflow-y:auto; background:rgba(0,0,0,.92); color:#4ade80; font-family:monospace; font-size:10px; padding:8px; z-index:999; border-bottom:2px solid #22c55e; white-space:pre-wrap; word-break:break-all;"></div>

  <script>
    (function () {
      const panel = document.getElementById('debugPanel');
      function log(...args) {
        const line = document.createElement('div');
        line.textContent = args.map(a => (typeof a === 'object' ? JSON.stringify(a) : String(a))).join(' ');
        panel.appendChild(line);
        panel.scrollTop = panel.scrollHeight;
      }
      window.__debugLog = log;
      window.onerror = function (msg, src, line, col, err) {
        log('❌ window.onerror:', msg, 'at line', line);
      };
      window.addEventListener('unhandledrejection', (e) => {
        log('❌ unhandledrejection:', e.reason?.message || e.reason);
      });
      log('✅ Debug panel aktif. slug =', new URLSearchParams(location.search).get('id'));
      log('supabase-js CDN loaded?', typeof window.supabase !== 'undefined' ? 'YES' : 'NO (belum/masih loading)');
    })();
  </script>

  <script>
    // DURATION AUDIOPLAYER (0 - 24 DETIK)
    const START_TIME = 0;
    const END_TIME = 24;

    // TIMELINE LIRIK & FOTO PRESISI DARI VIDEO
    const TIMELINE = [
      { time: 0, text: "...", photoIdx: 0 },
      { time: 3, text: "but you should know that i died slow", photoIdx: 1 },
      { time: 6, text: "running through the halls of your haunted home", photoIdx: 2 },
      { time: 9, text: "and the toughest part is that we both know", photoIdx: 3 },
      { time: 12, text: "what happened to you", photoIdx: 4 },
      { time: 15, text: "why you're out on your own", photoIdx: 5 },
      { time: 18, text: "merry christmas", photoIdx: 6 },
      { time: 20, text: "please don't call", photoIdx: 7 },
      { time: 21, text: "merry christmas", photoIdx: 8 },
      { time: 22, text: "please don't call", photoIdx: 9 }
    ];

    let galleryUrls = [];
    let isPlaying = false;

    // Elements
    const audio = document.getElementById('bgAudio');
    const playBtn = document.getElementById('playBtn');
    const lyricText = document.getElementById('lyricText');
    const galleryImg = document.getElementById('galleryImg');
    const loadingText = document.getElementById('loadingText');
    const playerCover = document.getElementById('playerCover');
    const progressBar = document.getElementById('progressBar');

    // Fetch Site Data from Supabase
    async function loadSiteData() {
      const urlParams = new URLSearchParams(window.location.search);
      const slug = urlParams.get('id');

      if (!slug) {
        lyricText.innerText = "Website not found.";
        return;
      }

      try {
        window.__debugLog('→ fetching /api/config...');
        const res = await fetch('/api/config');
        window.__debugLog('/api/config status:', res.status);
        if (!res.ok) {
          loadingText.innerText = `Config error: HTTP ${res.status}`;
          return;
        }
        const config = await res.json();
        window.__debugLog('config.supabaseUrl:', config.supabaseUrl);
        window.__debugLog('config.supabaseAnonKey (10 char):', (config.supabaseAnonKey || '').slice(0, 10));
        if (!config.supabaseUrl || !config.supabaseAnonKey) {
          loadingText.innerText = "Config error: supabaseUrl/anonKey kosong.";
          return;
        }

        window.__debugLog('typeof window.supabase:', typeof window.supabase);
        if (typeof window.supabase === 'undefined') {
          loadingText.innerText = "supabase-js CDN gagal load (cek koneksi/adblock).";
          window.__debugLog('❌ window.supabase undefined, CDN jsdelivr kemungkinan diblokir.');
          return;
        }

        const supabase = window.supabase.createClient(config.supabaseUrl.trim(), config.supabaseAnonKey.trim());
        window.__debugLog('✅ supabase client created');

        window.__debugLog('→ querying sites where slug =', slug);
        const { data, error } = await supabase.from('sites').select('*').eq('slug', slug).single();
        window.__debugLog('query done. error:', error ? error.message : 'null', '| data exists:', !!data);

        if (error) {
          loadingText.innerText = `DB error: ${error.message}`;
          console.error("Supabase error:", error);
          return;
        }
        if (!data) {
          loadingText.innerText = `Data untuk slug "${slug}" tidak ditemukan.`;
          return;
        }

        galleryUrls = Array.isArray(data.gallery_urls) ? data.gallery_urls : [];
        window.__debugLog('galleryUrls[0]:', galleryUrls[0] || '(kosong)');
        window.__debugLog('cover_url:', data.cover_url || '(kosong)');
        playerCover.src = data.cover_url || "";

        if (galleryUrls.length > 0) {
          galleryImg.onerror = (e) => {
            loadingText.innerText = "Gagal load gambar (cek URL/permission storage).";
            window.__debugLog('❌ galleryImg.onerror fired for src:', galleryImg.src);
          };
          galleryImg.onload = () => {
            loadingText.classList.add('hidden');
            window.__debugLog('✅ galleryImg.onload fired, foto berhasil tampil.');
          };
          window.__debugLog('→ setting galleryImg.src =', galleryUrls[0]);
          galleryImg.src = galleryUrls[0];
          galleryImg.classList.add('show');
        } else {
          loadingText.innerText = "gallery_urls kosong di database.";
        }

      } catch (err) {
        loadingText.innerText = `Fatal error: ${err.message}`;
        window.__debugLog('❌ CATCH fatal error:', err.message);
        console.error(err);
      }
    }

    // Audio Controls & Sync
    playBtn.onclick = () => {
      if (isPlaying) {
        audio.pause();
      } else {
        if (audio.currentTime >= END_TIME) {
          audio.currentTime = START_TIME;
        }
        audio.play();
      }
    };

    audio.onplay = () => {
      isPlaying = true;
      playBtn.innerText = "❚❚";
    };

    audio.onpause = () => {
      isPlaying = false;
      playBtn.innerText = "▶";
    };

    audio.ontimeupdate = () => {
      const current = audio.currentTime;

      // Batasi Audio sampai Detik 24 -> Loop kembali ke Detik 0
      if (current >= END_TIME) {
        audio.currentTime = START_TIME;
        return;
      }

      // Sync Progress Bar
      const progressPercent = (current / END_TIME) * 100;
      progressBar.style.width = `${Math.max(0, Math.min(100, progressPercent))}%`;

      // Sync Lirik & Foto Galeri berdasarkan Waktu
      for (let i = TIMELINE.length - 1; i >= 0; i--) {
        if (current >= TIMELINE[i].time) {
          const currentText = `"${TIMELINE[i].text}"`;
          if (lyricText.innerText !== currentText) {
            lyricText.innerText = currentText;

            // Ganti foto jika foto baru tersedia
            const photoIdx = TIMELINE[i].photoIdx;
            if (galleryUrls[photoIdx] && galleryImg.src !== galleryUrls[photoIdx]) {
              galleryImg.classList.remove('show');
              setTimeout(() => {
                galleryImg.src = galleryUrls[photoIdx];
                galleryImg.classList.add('show');
              }, 150);
            }
          }
          break;
        }
      }
    };

    loadSiteData();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>About You — Interactive Experience</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Playfair+Display:ital,wght@0,700;1,700&family=Space+Mono&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      background-color: #050507;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    /* Film Strip Animation Track */
    .film-strip-scene {
      position: fixed;
      inset: 0;
      z-index: 0;
      opacity: 0.18;
      pointer-events: none;
      overflow: hidden;
    }

    .film-track {
      display: flex;
      gap: 16px;
      width: max-content;
      animation: moveStrip 35s linear infinite;
    }

    .film-card {
      width: 140px;
      height: 140px;
      background: #18181b;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      object-fit: cover;
      filter: grayscale(100%);
    }

    @keyframes moveStrip {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* Cinematic Vignette & Grain */
    .cinematic-vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.85) 100%);
      pointer-events: none;
      z-index: 1;
    }

    /* Dynamic Camera & Card Motion */
    #photo-card {
      transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.6s ease;
      will-change: transform, opacity;
    }

    .card-zoom-in {
      transform: scale(1.05) translateY(-10px);
    }
    
    .card-zoom-out {
      transform: scale(0.95) translateY(10px);
    }

    /* Glassmorphism Styles */
    .glass-card {
      background: rgba(18, 18, 20, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .italic-serif {
      font-family: 'Playfair Display', serif;
      font-style: italic;
    }
  </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center p-4">

  <!-- Background Animated Film Strips -->
  <div class="film-strip-scene">
    <div class="film-track" id="filmTrack">
      <!-- Generated via JS -->
    </div>
  </div>

  <div class="cinematic-vignette"></div>

  <!-- Main Viewport / Camera Slot -->
  <main class="relative z-10 w-full max-w-sm mx-auto flex flex-col items-center text-center space-y-6">
    
    <!-- Photo Frame Card -->
    <div id="photo-card" class="glass-card p-3 rounded-2xl w-full shadow-2xl relative overflow-hidden">
      <div class="relative aspect-square w-full rounded-xl overflow-hidden bg-zinc-950/80 flex items-center justify-center">
        <img id="mainImage" src="" class="w-full h-full object-cover transition-all duration-500 opacity-0 scale-100" />
        <div id="loadingText" class="absolute font-mono text-xs text-white/30 tracking-widest uppercase">
          Loading experience...
        </div>
      </div>
    </div>

    <!-- Lyrics Text Display -->
    <div class="min-h-[70px] flex items-center justify-center px-4 w-full">
      <p id="lyricText" class="text-xl md:text-2xl italic-serif text-white/90 transition-all duration-300 drop-shadow-lg">
        "Press play to start..."
      </p>
    </div>

  </main>

  <!-- Player Overlay Bottom Bar -->
  <div class="fixed bottom-5 left-4 right-4 max-w-sm mx-auto glass-card p-3 rounded-2xl flex items-center space-x-3 z-20 shadow-2xl">
    <img id="playerCover" src="" class="w-12 h-12 rounded-lg object-cover bg-zinc-800 flex-shrink-0 border border-white/10" />
    
    <div class="flex-1 min-w-0 text-left">
      <h4 id="siteSlugTitle" class="text-xs font-bold text-white truncate">About You</h4>
      <p class="text-[10px] font-mono text-white/40 truncate">The 1975 — Bleach Ears</p>
      
      <!-- Progress Bar -->
      <div class="w-full bg-white/10 h-1 rounded-full mt-2 overflow-hidden cursor-pointer" id="progressContainer">
        <div id="progressBar" class="bg-white h-full w-0 transition-all duration-150"></div>
      </div>
    </div>

    <button id="playBtn" class="w-10 h-10 bg-white text-black rounded-full flex items-center justify-center font-bold text-sm flex-shrink-0 transition-transform active:scale-95">
      ▶
    </button>
  </div>

  <audio id="bgAudio" src="/audio.mp3" preload="auto"></audio>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const END_TIME = 24;

      // TIMELINE SINKRONISASI PRESISI VIDEO REFERENSI
      const TIMELINE = [
        { time: 0, text: "...", photoIdx: 0 },
        { time: 4, text: "but you should know that i died slow", photoIdx: 1 },
        { time: 8, text: "running through the halls of your haunted home", photoIdx: 2 },
        { time: 11, text: "and the toughest part is that we both know", photoIdx: 3 },
        { time: 14, text: "what happened to you", photoIdx: 4 },
        { time: 17, text: "why you're out on your own", photoIdx: 5 },
        { time: 20, text: "merry christmas", photoIdx: 6 },
        { time: 21, text: "please don't call", photoIdx: 7 },
        { time: 22, text: "merry christmas", photoIdx: 8 },
        { time: 23, text: "please don't call", photoIdx: 9 }
      ];

      let galleryUrls = [];
      let isPlaying = false;

      const audio = document.getElementById('bgAudio');
      const playBtn = document.getElementById('playBtn');
      const lyricText = document.getElementById('lyricText');
      const mainImage = document.getElementById('mainImage');
      const photoCard = document.getElementById('photo-card');
      const loadingText = document.getElementById('loadingText');
      const playerCover = document.getElementById('playerCover');
      const progressBar = document.getElementById('progressBar');
      const filmTrack = document.getElementById('filmTrack');
      const siteSlugTitle = document.getElementById('siteSlugTitle');

      function getSlug() {
        const queryId = new URLSearchParams(window.location.search).get('id');
        if (queryId) return queryId;
        const path = window.location.pathname.split('/').filter(Boolean)[0];
        return (path && path !== 'view.html') ? path : null;
      }

      async function loadData() {
        const slug = getSlug();
        if (!slug) {
          lyricText.innerText = "Website ID not found.";
          return;
        }

        siteSlugTitle.innerText = `@${slug}`;

        try {
          const res = await fetch('/api/config');
          const config = await res.json();
          
          if (!config.supabaseUrl || !config.supabaseAnonKey) return;

          const supabase = window.supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);
          const { data, error } = await supabase.from('sites').select('*').eq('slug', slug).single();

          if (error || !data) {
            lyricText.innerText = "Site data not found.";
            return;
          }

          galleryUrls = data.gallery_urls || [];
          playerCover.src = data.cover_url || '';

          // Build Background Film Strip
          filmTrack.innerHTML = "";
          const stripPhotos = [data.cover_url, ...galleryUrls, ...galleryUrls];
          stripPhotos.forEach(url => {
            const img = document.createElement('img');
            img.src = url;
            img.className = 'film-card';
            filmTrack.appendChild(img);
          });

          // Show First Photo
          if (galleryUrls.length > 0) {
            mainImage.src = galleryUrls[0];
            mainImage.classList.remove('opacity-0');
            loadingText.classList.add('hidden');
          }

        } catch (e) {
          lyricText.innerText = "Error loading memories.";
        }
      }

      playBtn.onclick = () => {
        if (isPlaying) {
          audio.pause();
        } else {
          if (audio.currentTime >= END_TIME) audio.currentTime = 0;
          audio.play();
        }
      };

      audio.onplay = () => {
        isPlaying = true;
        playBtn.innerText = "❚❚";
      };

      audio.onpause = () => {
        isPlaying = false;
        playBtn.innerText = "▶";
      };

      audio.ontimeupdate = () => {
        const current = audio.currentTime;

        if (current >= END_TIME) {
          audio.currentTime = 0;
          return;
        }

        // Progress Bar
        progressBar.style.width = `${(current / END_TIME) * 100}%`;

        // Sync Timeline & Camera Motion Effect
        for (let i = TIMELINE.length - 1; i >= 0; i--) {
          if (current >= TIMELINE[i].time) {
            const text = `"${TIMELINE[i].text}"`;
            
            if (lyricText.innerText !== text) {
              lyricText.innerText = text;
              
              const pIdx = TIMELINE[i].photoIdx;
              if (galleryUrls[pIdx] && mainImage.src !== galleryUrls[pIdx]) {
                
                // Trigger Camera Zoom Transition
                photoCard.classList.add('card-zoom-out');
                mainImage.classList.add('opacity-0');

                setTimeout(() => {
                  mainImage.src = galleryUrls[pIdx];
                  mainImage.classList.remove('opacity-0');
                  photoCard.classList.remove('card-zoom-out');
                  photoCard.classList.add('card-zoom-in');
                  
                  setTimeout(() => photoCard.classList.remove('card-zoom-in'), 400);
                }, 200);
              }
            }
            break;
          }
        }
      };

      loadData();
    });
  </script>
</body>
</html>

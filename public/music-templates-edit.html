<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Builder</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background-color: #0a0a0a; color: #e5e5e5; font-family: sans-serif; }
    .card-bg { background-color: #121212; border: 1px solid #262626; }
  </style>
</head>
<body class="min-h-screen p-4 flex justify-center items-start">

  <div class="w-full max-w-md space-y-6 my-6">
    <!-- Header -->
    <div>
      <p class="text-xs uppercase tracking-widest text-zinc-500 font-semibold">Website Builder</p>
      <h1 class="text-3xl font-serif font-bold text-white mt-1">Build your website</h1>
    </div>

    <!-- Card 1: Website Name / Slug -->
    <div class="card-bg p-5 rounded-2xl space-y-3">
      <label class="block text-sm font-medium text-zinc-300">Website name</label>
      <div class="relative">
        <input type="text" id="slugInput" placeholder="ForAraa" 
               class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-zinc-500 text-sm">
        <span id="slugStatus" class="hidden absolute right-3 top-3 text-xs font-semibold px-2 py-1 rounded bg-emerald-950 text-emerald-400 border border-emerald-800">
          Available
        </span>
      </div>
      <p class="text-xs text-zinc-500">yoursite.vercel.app/<span id="slugPreview" class="text-zinc-400">your-name</span></p>
    </div>

    <!-- Card 2: Song Cover -->
    <div class="card-bg p-5 rounded-2xl space-y-3">
      <label class="block text-sm font-medium text-zinc-300">Song cover</label>
      <div id="coverBox" class="relative aspect-square w-full bg-zinc-900 border border-dashed border-zinc-800 rounded-xl flex flex-col justify-center items-center cursor-pointer overflow-hidden group">
        <input type="file" id="coverInput" accept="image/*" class="hidden">
        <div id="coverPlaceholder" class="text-center p-4">
          <span class="text-xs bg-zinc-800 text-zinc-300 px-3 py-1 rounded-md">Cover</span>
          <p class="text-xs text-zinc-500 mt-2">Ketuk untuk upload foto sampul</p>
        </div>
        <img id="coverPreview" class="hidden w-full h-full object-cover">
      </div>
    </div>

    <!-- Card 3: Gallery Photos -->
    <div class="card-bg p-5 rounded-2xl space-y-3">
      <div class="flex justify-between items-center">
        <label class="block text-sm font-medium text-zinc-300">Gallery photos</label>
        <span id="galleryCounter" class="text-xs text-zinc-500 font-mono">0/10</span>
      </div>
      
      <!-- Grid 10 Foto -->
      <div class="grid grid-cols-3 gap-2" id="galleryGrid">
        <!-- JS akan me-render 10 slot foto di sini -->
      </div>
      <input type="file" id="galleryInput" accept="image/*" multiple class="hidden">
    </div>

    <!-- Generate Button -->
    <button id="generateBtn" disabled 
            class="w-full bg-zinc-800 text-zinc-500 font-semibold py-4 rounded-xl text-sm transition-all duration-200">
      Generate website
    </button>
  </div>

  <!-- Modal Success -->
  <div id="successModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex justify-center items-center p-4 hidden z-50">
    <div class="card-bg p-6 rounded-2xl w-full max-w-sm text-center space-y-5 border border-zinc-800">
      <div class="w-12 h-12 bg-emerald-500/10 text-emerald-500 rounded-full flex items-center justify-center mx-auto border border-emerald-500/20 text-xl">
        ✓
      </div>
      <div>
        <h3 class="text-lg font-bold text-white">Website created successfully</h3>
        <p class="text-xs text-zinc-400 mt-1">Your site is live and ready to share.</p>
      </div>
      
      <div class="bg-zinc-900 border border-zinc-800 p-3 rounded-xl text-xs font-mono text-zinc-300 break-all" id="resultUrl">
        https://yoursite.vercel.app/view.html?id=...
      </div>

      <div class="space-y-2">
        <button id="copyBtn" class="w-full bg-zinc-800 hover:bg-zinc-700 text-white font-medium py-3 rounded-xl text-sm">
          Copy link
        </button>
        <a id="openBtn" href="#" target="_blank" class="block w-full bg-white text-black font-semibold py-3 rounded-xl text-sm">
          Open website
        </a>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>KYY Sticker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f3f1;--card:#fff;--ink:#111;--mut:#6b6b6b;--line:#e2e2de}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Inter",Arial,sans-serif;font-size:15px;line-height:1.45;font-weight:500;background:var(--bg);color:var(--ink);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
input,button,textarea{font-family:inherit;font-weight:inherit}
input{user-select:text;-webkit-user-select:text}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;user-select:none;-webkit-user-select:none;outline:none}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
img{display:block;-webkit-user-drag:none;user-select:none;pointer-events:none}
::selection{background:transparent}
.top{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top,0px))}
.top h1{font-size:16px;font-weight:700;letter-spacing:.03em}
.badge{font-size:13px;opacity:.8;font-variant-numeric:tabular-nums}
main{padding:14px;display:grid;gap:12px;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.label{display:block;font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.head .label{margin:0}
input{width:100%;height:46px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:15px;background:#fff;color:var(--ink);outline:none}
input:focus{border-color:var(--ink)}
.row{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;height:44px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--ink);border-radius:10px;font-weight:600;background:#fff}
.btn.primary{background:var(--ink);color:#fff}
.btn:disabled{opacity:.4}
.btn.full{width:100%;flex:none}
.link{font-size:13px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.status{margin-top:10px;font-size:13px;color:var(--mut);min-height:1.45em}
.hint{font-size:13px;color:var(--mut);margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{position:relative;aspect-ratio:1;border:2px solid var(--line);border-radius:10px;overflow:hidden;background:repeating-conic-gradient(#ececea 0 25%,#fff 0 50%) 0 0/16px 16px;padding:0}
.tile img{width:100%;height:100%;object-fit:contain}
.tile.on{border-color:var(--ink)}
.tile.on::after{content:"";position:absolute;right:6px;top:6px;width:18px;height:18px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 2px #fff}
.tile .tag{position:absolute;left:4px;bottom:4px;font-size:10px;font-weight:700;background:#fff;border:1px solid var(--line);padding:1px 5px;border-radius:6px;letter-spacing:.04em;pointer-events:none}
.tile.broken{opacity:.35}
.pack{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.pack .hint{grid-column:1/-1;margin:0}
.ptile{position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:repeating-conic-gradient(#ececea 0 25%,#fff 0 50%) 0 0/12px 12px}
.ptile img{width:100%;height:100%;object-fit:contain}
.ptile .x{position:absolute;left:0;right:0;bottom:0;height:24px;background:rgba(17,17,17,.88);color:#fff;font-size:11px;font-weight:600}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.fields .label{margin-bottom:6px}
.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.bottom .btn{width:100%;max-width:560px;margin:0 auto;display:flex}
</style>
</head>
<body>
<header class="top">
  <h1>KYY STICKER</h1>
  <span class="badge" id="badge">0/30</span>
</header>

<main>
  <section class="card">
    <label class="label" for="link">Link komentar stiker</label>
    <input id="link" type="url" inputmode="url" placeholder="https://vt.tiktok.com/..." autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="row">
      <button class="btn" id="btnPaste" type="button">Tempel</button>
      <button class="btn primary" id="btnFetch" type="button">Ambil</button>
      <button class="btn" id="btnGallery" type="button">Galeri</button>
    </div>
    <input id="file" type="file" accept="image/*" hidden>
    <p class="status" id="status">Tempel link komentar stiker dari TikTok.</p>
  </section>

  <section class="card">
    <div class="head">
      <span class="label">Hasil</span>
      <button class="link" id="btnAll" type="button">Pilih semua</button>
    </div>
    <div id="grid" class="grid"></div>
    <p class="hint" id="hint"></p>
    <div class="row">
      <button class="btn full" id="btnAdd" type="button" disabled>Tambah terpilih ke paket</button>
    </div>
  </section>

  <section class="card">
    <div class="head">
      <span class="label">Paket</span>
      <button class="link" id="btnReset" type="button">Kosongkan</button>
    </div>
    <div class="fields">
      <div>
        <label class="label" for="pname">Nama paket</label>
        <input id="pname" maxlength="60" value="KYY Sticker Pack">
      </div>
      <div>
        <label class="label" for="pauthor">Pembuat</label>
        <input id="pauthor" maxlength="60" value="KYY Studio">
      </div>
    </div>
    <div id="packGrid" class="pack"></div>
  </section>
</main>

<footer class="bottom">
  <button class="btn primary" id="btnWA" type="button" disabled>Tambah ke WhatsApp</button>
</footer>

<script>
(function () {
  'use strict';

  const MAX = 30, MIN = 3;
  const WA_STATIC = 100 * 1024, WA_ANIM = 500 * 1024;
  const $ = (id) => document.getElementById(id);

  let items = [];          // {key, src, isTarget, broken}
  let selected = new Set();
  let pack = [];           // {key, data, animated}
  let lastLink = '';
  let busy = false;
  let timer = null;
  let localSeq = 0;

  // Blokir klik kanan, drag, dan seleksi teks di luar kolom input
  document.addEventListener('contextmenu', (e) => e.preventDefault());
  document.addEventListener('dragstart', (e) => e.preventDefault());
  document.addEventListener('selectstart', (e) => {
    if (!(e.target && e.target.closest && e.target.closest('input'))) e.preventDefault();
  });

  function setStatus(t) { $('status').textContent = t; }

  function setBusy(v) {
    busy = v;
    $('btnFetch').disabled = v;
    $('btnPaste').disabled = v;
    updateHint();
    renderPack();
  }

  function sizeOf(d) {
    return Math.floor((d.length - d.indexOf(',') - 1) * 3 / 4);
  }

  function webpInfo(u8) {
    if (u8.length < 30) return null;
    const s = (a, b) => String.fromCharCode.apply(null, Array.from(u8.slice(a, b)));
    if (s(0, 4) !== 'RIFF' || s(8, 12) !== 'WEBP') return null;
    if (s(12, 16) !== 'VP8X') return { animated: false, w: 0, h: 0 };
    return {
      animated: !!(u8[20] & 2),
      w: 1 + (u8[24] | (u8[25] << 8) | (u8[26] << 16)),
      h: 1 + (u8[27] | (u8[28] << 8) | (u8[29] << 16))
    };
  }

  function readAsDataURL(blob) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result);
      r.onerror = () => rej(new Error('Gagal membaca file.'));
      r.readAsDataURL(blob);
    });
  }

  function loadImage(src) {
    return new Promise((res, rej) => {
      const i = new Image();
      i.onload = () => res(i);
      i.onerror = () => rej(new Error('Format gambar tidak didukung.'));
      i.src = src;
    });
  }

  // Ubah gambar/stiker jadi format WhatsApp: gerak (512x512, <=500 KB) dipertahankan, selain itu WebP diam <=100 KB
  async function blobToSticker(blob) {
    const head = new Uint8Array(await blob.slice(0, 32).arrayBuffer());
    const info = webpInfo(head);
    if (info && info.animated) {
      if (info.w === 512 && info.h === 512 && blob.size <= WA_ANIM) {
        return { data: await readAsDataURL(blob), animated: true };
      }
      throw new Error('Stiker gerak tidak memenuhi syarat WhatsApp (512x512, maks 500 KB).');
    }
    if (info && info.w === 512 && info.h === 512 && blob.size <= WA_STATIC) {
      return { data: await readAsDataURL(blob), animated: false };
    }
    const url = URL.createObjectURL(blob);
    try {
      const img = await loadImage(url);
      const cv = document.createElement('canvas');
      cv.width = 512; cv.height = 512;
      const cx = cv.getContext('2d');
      const k = Math.min(512 / img.naturalWidth, 512 / img.naturalHeight);
      const w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
      cx.drawImage(img, Math.round((512 - w) / 2), Math.round((512 - h) / 2), w, h);
      let q = 0.9;
      let d = cv.toDataURL('image/webp', q);
      while (sizeOf(d) > WA_STATIC && q > 0.1) {
        q = Math.round((q - 0.1) * 10) / 10;
        d = cv.toDataURL('image/webp', q);
      }
      if (!d.startsWith('data:image/webp')) throw new Error('Browser ini tidak bisa membuat WebP.');
      if (sizeOf(d) > WA_STATIC) throw new Error('Gambar terlalu besar untuk stiker diam.');
      return { data: d, animated: false };
    } finally {
      URL.revokeObjectURL(url);
    }
  }

  function pushSticker(key, s) {
    if (pack.length >= MAX) return 'full';
    if (pack.some((p) => p.key === key)) return 'dup';
    if (pack.length && pack[0].animated !== s.animated) return 'type';
    pack.push({ key: key, data: s.data, animated: s.animated });
    return 'ok';
  }

  function summary(c) {
    const parts = [];
    if (c.ok) parts.push(c.ok + ' stiker ditambahkan');
    if (c.dup) parts.push(c.dup + ' sudah ada di paket');
    if (c.type) parts.push(c.type + ' dilewati karena beda jenis (gerak/diam). Satu paket hanya boleh satu jenis');
    if (c.full) parts.push('paket penuh, maksimal ' + MAX);
    if (c.fail) parts.push(c.fail + ' gagal diproses');
    return parts.length ? parts.join('. ') + '.' : 'Tidak ada perubahan.';
  }

  function scheduleFetch(ms) {
    clearTimeout(timer);
    timer = setTimeout(() => fetchLink(true), ms);
  }

  async function fetchLink(auto) {
    if (busy) return;
    const m = $('link').value.match(/https?:\/\/\S+/);
    if (!m || !/tiktok\.com/i.test(m[0])) {
      if (!auto) setStatus('Tempel link TikTok dulu.');
      return;
    }
    const link = m[0].replace(/[)\]}>.,;]+$/, '');
    $('link').value = link;
    if (auto && link === lastLink) return;

    setBusy(true);
    setStatus('Mengambil komentar dan stiker...');
    try {
      const r = await fetch('/api/comment-sticker?url=' + encodeURIComponent(link));
      let j;
      try {
        j = await r.json();
      } catch (e) {
        throw new Error('Server belum terpasang. Pastikan folder api sudah ada di Vercel.');
      }
      if (!j.ok) throw new Error(j.error || 'Gagal mengambil data.');
      lastLink = link;
      items = j.items.map((it) => ({ key: it.src, src: it.src, isTarget: it.isTarget, broken: false }));
      selected = new Set(items.filter((it) => it.isTarget).map((it) => it.key));
      renderGrid();
      const nt = items.filter((it) => it.isTarget).length;
      setStatus(
        j.found
          ? nt + ' stiker dari komentar ditemukan. Stiker lain dari video ini juga bisa dipilih.'
          : 'Komentar target tidak terbaca. Pilih stiker dari daftar di bawah.'
      );
    } catch (e) {
      items = [];
      selected = new Set();
      renderGrid();
      setStatus(e.message || 'Gagal mengambil data.');
    }
    setBusy(false);
  }

  function renderGrid() {
    const g = $('grid');
    g.textContent = '';
    items.forEach((it) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'tile' + (selected.has(it.key) ? ' on' : '') + (it.broken ? ' broken' : '');
      b.disabled = it.broken;
      const img = new Image();
      img.draggable = false;
      img.alt = '';
      img.onerror = () => {
        it.broken = true;
        selected.delete(it.key);
        b.classList.add('broken');
        b.classList.remove('on');
        b.disabled = true;
        updateHint();
      };
      img.src = it.src;
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = it.isTarget ? 'KOMENTAR' : 'VIDEO';
      b.append(img, tag);
      b.onclick = () => {
        if (selected.has(it.key)) {
          selected.delete(it.key);
          b.classList.remove('on');
        } else {
          selected.add(it.key);
          b.classList.add('on');
        }
        updateHint();
      };
      g.appendChild(b);
    });
    updateHint();
  }

  function updateHint() {
    const n = selected.size;
    const usable = items.filter((it) => !it.broken).length;
    $('hint').textContent = items.length ? usable + ' stiker tersedia, ' + n + ' dipilih.' : '';
    $('btnAdd').disabled = busy || n === 0;
    $('btnAll').textContent = usable && n === usable ? 'Batal pilih' : 'Pilih semua';
  }

  async function addSelected() {
    const list = items.filter((it) => selected.has(it.key) && !it.broken);
    if (!list.length) return;
    setBusy(true);
    const c = { ok: 0, dup: 0, type: 0, full: 0, fail: 0 };
    for (let i = 0; i < list.length; i++) {
      if (pack.length >= MAX) { c.full += list.length - i; break; }
      if (pack.some((p) => p.key === list[i].key)) { c.dup++; continue; }
      setStatus('Memproses ' + (i + 1) + ' dari ' + list.length + '...');
      try {
        const r = await fetch(list[i].src + '&n=1');
        if (!r.ok) throw new Error('gagal unduh');
        const s = await blobToSticker(await r.blob());
        c[pushSticker(list[i].key, s)]++;
      } catch (e) {
        c.fail++;
      }
    }
    setBusy(false);
    setStatus(summary(c));
  }

  function renderPack() {
    const g = $('packGrid');
    g.textContent = '';
    pack.forEach((p, i) => {
      const d = document.createElement('div');
      d.className = 'ptile';
      const img = new Image();
      img.draggable = false;
      img.alt = '';
      img.src = p.data;
      const x = document.createElement('button');
      x.type = 'button';
      x.className = 'x';
      x.textContent = 'Hapus';
      x.onclick = () => { pack.splice(i, 1); renderPack(); };
      d.append(img, x);
      g.appendChild(d);
    });
    if (!pack.length) {
      const p = document.createElement('p');
      p.className = 'hint';
      p.textContent = 'Paket masih kosong.';
      g.appendChild(p);
    }
    $('badge').textContent = pack.length + '/' + MAX;
    $('btnWA').disabled = busy || pack.length < MIN;
  }

  function packId() {
    let id = null;
    try { id = localStorage.getItem('kyy.packId'); } catch (e) {}
    if (!id) {
      id = 'kyy' + Date.now().toString(36);
      try { localStorage.setItem('kyy.packId', id); } catch (e) {}
    }
    return id;
  }

  async function makeTray(data) {
    const img = await loadImage(data);
    const cv = document.createElement('canvas');
    cv.width = 96; cv.height = 96;
    const cx = cv.getContext('2d');
    const k = Math.min(96 / img.naturalWidth, 96 / img.naturalHeight);
    const w = img.naturalWidth * k, h = img.naturalHeight * k;
    cx.drawImage(img, (96 - w) / 2, (96 - h) / 2, w, h);
    return cv.toDataURL('image/png');
  }

  async function sendWA() {
    if (pack.length < MIN) {
      setStatus('Minimal ' + MIN + ' stiker. Sekarang ' + pack.length + '.');
      return;
    }
    if (!window.AndroidBridge) {
      setStatus('Tambah ke WhatsApp hanya bisa dari aplikasi KYY Sticker.');
      return;
    }
    setBusy(true);
    setStatus('Menyiapkan paket...');
    try {
      const tray = await makeTray(pack[0].data);
      window.AndroidBridge.addStickerPackToWhatsApp(JSON.stringify({
        identifier: packId(),
        name: $('pname').value.trim() || 'KYY Sticker Pack',
        publisher: $('pauthor').value.trim() || 'KYY Studio',
        tray_image: tray,
        stickers: pack.map((p) => ({ data: p.data, emojis: [] }))
      }));
      setStatus('Konfirmasi di WhatsApp untuk menambahkan paket.');
    } catch (e) {
      setStatus('Gagal menyiapkan paket.');
    }
    setBusy(false);
  }

  // Event
  $('link').addEventListener('input', () => scheduleFetch(700));
  $('link').addEventListener('paste', () => scheduleFetch(150));
  $('link').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); fetchLink(false); } });
  $('btnFetch').onclick = () => fetchLink(false);
  $('btnPaste').onclick = async () => {
    try {
      $('link').value = (await navigator.clipboard.readText()).trim();
      fetchLink(true);
    } catch (e) {
      setStatus('Izin clipboard ditolak. Tekan lama kolom link, lalu pilih Tempel.');
    }
  };
  $('btnAll').onclick = () => {
    const usable = items.filter((it) => !it.broken);
    if (!usable.length) return;
    if (selected.size === usable.length) selected = new Set();
    else selected = new Set(usable.map((it) => it.key));
    renderGrid();
  };
  $('btnAdd').onclick = addSelected;
  $('btnGallery').onclick = () => $('file').click();
  $('file').onchange = async (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    setBusy(true);
    setStatus('Memproses gambar...');
    try {
      const s = await blobToSticker(f);
      const r = pushSticker('local-' + (++localSeq), s);
      const c = {}; c[r] = 1;
      setStatus(summary(c));
    } catch (err) {
      setStatus(err.message || 'Gagal memproses gambar.');
    }
    setBusy(false);
  };
  $('btnReset').onclick = () => { pack = []; renderPack(); setStatus('Paket dikosongkan.'); };
  $('btnWA').onclick = sendWA;

  renderPack();
  updateHint();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - KYY Dashboard</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
  <style>

@import url("https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap");

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  background: #252432;
  padding: 40px 20px;
}

@property --a {
  syntax: "<angle>";
  inherits: false;
  initial-value: 0deg;
}

.box {
  position: relative;
  width: 400px;
  height: 200px;
  background: repeating-conic-gradient(
    from var(--a),
    #ff2770 0%,
    #ff2770 5%,
    transparent 5%,
    transparent 40%,
    #ff2770 50%
  );
  filter: drop-shadow(0 15px 50px #000);
  animation: rotating 4s linear infinite;
  border-radius: 20px;
  display: flex;
  justify-content: center;
  align-items: center;
  transition: 0.5s;
}

.box.active,
.box:hover {
  width: 450px;
  height: 620px;
}

@keyframes rotating {
  0% {
    --a: 0deg;
  }
  100% {
    --a: 360deg;
  }
}

.box::before {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  background: repeating-conic-gradient(
    from var(--a),
    #45f3ff 0%,
    #45f3ff 5%,
    transparent 5%,
    transparent 40%,
    #45f3ff 50%
  );
  filter: drop-shadow(0 15px 50px #000);
  border-radius: 20px;
  animation: rotating 4s linear infinite;
  animation-delay: -1s;
}

.box::after {
  content: "";
  position: absolute;
  inset: 4px;
  background: #2d2d39;
  border-radius: 15px;
  border: 8px solid #25252b;
}

.login {
  position: absolute;
  inset: 60px;
  display: flex;
  justify-content: flex-start;
  align-items: center;
  border-radius: 10px;
  flex-direction: column;
  background: rgba(0, 0, 0, 0.2);
  z-index: 1000;
  box-shadow: inset 0 10px 20px rgba(0, 0, 0, 0.5);
  border-bottom: 2px solid rgba(255, 255, 255, 0.5);
  transition: 0.5s;
  color: #fff;
  overflow: hidden;
  padding: 20px 0;
}

.box.active .login,
.box:hover .login {
  inset: 30px;
}

.loginBx {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  transform: translateY(126px);
  gap: 14px;
  width: 78%;
  transition: 0.5s;
}

.box.active .loginBx,
.box:hover .loginBx {
  transform: translateY(0px);
}

.loginBx h2 {
  text-transform: uppercase;
  letter-spacing: 0.15em;
  font-weight: 600;
  font-size: 1.1em;
}

.loginBx h2 i {
  color: #ff2770;
  text-shadow: 0 0 5px #ff2770, 0 0 30px #ff2770;
}

.loginBx input {
  width: 100%;
  padding: 10px 20px;
  outline: none;
  font-size: 0.95em;
  color: #fff;
  background: rgba(0, 0, 0, 0.1);
  border: 2px solid #fff;
  border-radius: 30px;
}

.loginBx input::placeholder {
  color: #999;
}

.loginBx input[type="submit"],
.btn-primary {
  background: #45f3ff;
  border: none;
  font-weight: 600;
  color: #111;
  cursor: pointer;
  transition: 0.5s;
  width: 100%;
  padding: 10px 20px;
  border-radius: 30px;
  font-size: 0.95em;
}

.loginBx input[type="submit"]:hover,
.btn-primary:hover {
  box-shadow: 0 0 10px #45f3ff, 0 0 60px #45f3ff;
}

.btn-primary:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  box-shadow: none;
}

.group {
  display: flex;
  width: 100%;
  justify-content: space-between;
}

.group a {
  color: #fff;
  text-decoration: none;
  font-size: 0.85em;
  cursor: pointer;
}

.group a.link-accent {
  color: #ff2770;
  font-weight: 600;
}

.loginBx p.subtitle {
  color: #ccc;
  font-size: 0.72em;
  text-align: center;
  letter-spacing: 0.05em;
}

.divider {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  color: #999;
  font-size: 0.7em;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

.divider::before,
.divider::after {
  content: "";
  flex: 1;
  height: 1px;
  background: rgba(255, 255, 255, 0.2);
}

.btn-google {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 10px 20px;
  background: #fff;
  color: #222;
  border: none;
  border-radius: 30px;
  font-size: 0.9em;
  font-weight: 600;
  cursor: pointer;
  transition: 0.3s;
}

.btn-google:hover {
  box-shadow: 0 0 10px #45f3ff, 0 0 40px #45f3ff;
  transform: translateY(-1px);
}

.btn-google:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

.btn-google i.fa-google {
  color: #4285F4;
  font-size: 1.1em;
}

.status-text {
  color: #45f3ff;
  font-size: 0.72em;
  letter-spacing: 0.03em;
  text-align: center;
  min-height: 16px;
}

.status-text.error {
  color: #ff5477;
}

.otp-input {
  letter-spacing: 0.5em;
  text-align: center;
  font-size: 1.2em !important;
}

.hidden {
  display: none !important;
}

</style>
<body>

<div class="box" id="loginBox">
  <div class="login">

    <!-- ==== MASUK ==== -->
    <div class="loginBx" id="viewLogin">
      <h2>
        <i class="fa-solid fa-right-to-bracket"></i>
          Masuk
        <i class="fa-solid fa-heart"></i>
      </h2>
      <input type="email" id="loginEmail" placeholder="Email" autocomplete="email">
      <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
      <button type="button" class="btn-primary" id="btnLogin" onclick="loginWithPassword()">Masuk</button>
      <p class="status-text" id="statusLogin"></p>

      <div class="divider">atau</div>

      <button type="button" class="btn-google" id="btnGoogleLogin" onclick="loginWithGoogle()">
        <i class="fa-brands fa-google"></i> Login With Google
      </button>

      <div class="group">
        <a class="link-accent" onclick="showView('signup')">Belum punya akun? Daftar</a>
      </div>
    </div>

    <!-- ==== DAFTAR ==== -->
    <div class="loginBx hidden" id="viewSignup">
      <h2>
        <i class="fa-solid fa-user-plus"></i>
          Daftar
        <i class="fa-solid fa-heart"></i>
      </h2>
      <input type="email" id="signupEmail" placeholder="Email" autocomplete="email">
      <input type="password" id="signupPassword" placeholder="Password (min. 6 karakter)" autocomplete="new-password">
      <input type="password" id="signupPasswordConfirm" placeholder="Ulangi Password" autocomplete="new-password">
      <button type="button" class="btn-primary" id="btnSignup" onclick="signUp()">Daftar</button>
      <p class="status-text" id="statusSignup"></p>

      <div class="group">
        <a class="link-accent" onclick="showView('login')">Sudah punya akun? Masuk</a>
      </div>
    </div>

    <!-- ==== VERIFIKASI OTP ==== -->
    <div class="loginBx hidden" id="viewOtp">
      <h2>
        <i class="fa-solid fa-shield-halved"></i>
          Verifikasi
      </h2>
      <p class="subtitle" id="otpSubtitle">Masukkan 6 digit kode yang dikirim ke emailmu</p>
      <input type="text" id="otpCode" class="otp-input" placeholder="000000" maxlength="6" inputmode="numeric">
      <button type="button" class="btn-primary" id="btnVerifyOtp" onclick="verifyOtp()">Verifikasi</button>
      <p class="status-text" id="statusOtp"></p>

      <div class="group">
        <a onclick="showView('login')">Batal</a>
        <a class="link-accent" onclick="resendOtp()">Kirim ulang kode</a>
      </div>
    </div>

  </div>
</div>

<script>
  const SUPABASE_URL = "https://djojqarslfsvubuflwdn.supabase.co";
  const SUPABASE_KEY = "sb_publishable_vqUvkJX5XNx5_D75lCnJzw_KPeFSim9";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const REDIRECT_URL = "https://jrxrezkyy-dashboard.vercel.app/index.html";

  let pendingEmail = "";
  const box = document.getElementById('loginBox');

  function showView(name) {
    document.getElementById('viewLogin').classList.add('hidden');
    document.getElementById('viewSignup').classList.add('hidden');
    document.getElementById('viewOtp').classList.add('hidden');
    document.getElementById('view' + name.charAt(0).toUpperCase() + name.slice(1)).classList.remove('hidden');
    box.classList.add('active');
    clearStatus();
  }

  function clearStatus() {
    ['statusLogin', 'statusSignup', 'statusOtp'].forEach(id => {
      const el = document.getElementById(id);
      el.textContent = '';
      el.classList.remove('error');
    });
  }

  function setStatus(id, msg, isError) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.classList.toggle('error', !!isError);
  }

  async function checkExistingSession() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
      window.location.href = REDIRECT_URL;
    }
  }
  checkExistingSession();

  // ===== LOGIN GOOGLE =====
  async function loginWithGoogle() {
    const btn = document.getElementById('btnGoogleLogin');
    btn.disabled = true;
    setStatus('statusLogin', 'Membuka halaman login Google...');

    const { error } = await supabaseClient.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: REDIRECT_URL }
    });

    if (error) {
      setStatus('statusLogin', 'Gagal membuka login: ' + error.message, true);
      btn.disabled = false;
    }
  }

  // ===== LOGIN EMAIL + PASSWORD =====
  async function loginWithPassword() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const btn = document.getElementById('btnLogin');

    if (!email || !password) {
      setStatus('statusLogin', 'Email dan password wajib diisi.', true);
      return;
    }

    btn.disabled = true;
    setStatus('statusLogin', 'Memproses...');

    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) {
      btn.disabled = false;
      if (error.message.toLowerCase().includes('confirm')) {
        pendingEmail = email;
        setStatus('statusLogin', 'Email belum diverifikasi, cek kode OTP kamu.', true);
        document.getElementById('otpSubtitle').textContent = 'Masukkan 6 digit kode yang dikirim ke ' + email;
        showView('otp');
        resendOtp(true);
      } else {
        setStatus('statusLogin', 'Login gagal: ' + error.message, true);
      }
      return;
    }

    setStatus('statusLogin', 'Berhasil, mengalihkan...');
    window.location.href = REDIRECT_URL;
  }

  // ===== DAFTAR =====
  async function signUp() {
    const email = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value;
    const confirm = document.getElementById('signupPasswordConfirm').value;
    const btn = document.getElementById('btnSignup');

    if (!email || !password || !confirm) {
      setStatus('statusSignup', 'Semua kolom wajib diisi.', true);
      return;
    }
    if (password.length < 6) {
      setStatus('statusSignup', 'Password minimal 6 karakter.', true);
      return;
    }
    if (password !== confirm) {
      setStatus('statusSignup', 'Konfirmasi password tidak cocok.', true);
      return;
    }

    btn.disabled = true;
    setStatus('statusSignup', 'Mendaftarkan akun...');

    const { data, error } = await supabaseClient.auth.signUp({ email, password });

    btn.disabled = false;

    if (error) {
      setStatus('statusSignup', 'Gagal daftar: ' + error.message, true);
      return;
    }

    pendingEmail = email;
    document.getElementById('otpSubtitle').textContent = 'Masukkan 6 digit kode yang dikirim ke ' + email;
    showView('otp');
    setStatus('statusOtp', 'Kode verifikasi sudah dikirim ke emailmu.');
  }

  // ===== VERIFIKASI OTP =====
  async function verifyOtp() {
    const code = document.getElementById('otpCode').value.trim();
    const btn = document.getElementById('btnVerifyOtp');

    if (!pendingEmail) {
      setStatus('statusOtp', 'Sesi tidak valid, ulangi dari awal.', true);
      showView('login');
      return;
    }
    if (!code || code.length !== 6) {
      setStatus('statusOtp', 'Kode harus 6 digit.', true);
      return;
    }

    btn.disabled = true;
    setStatus('statusOtp', 'Memverifikasi...');

    const { data, error } = await supabaseClient.auth.verifyOtp({
      email: pendingEmail,
      token: code,
      type: 'signup'
    });

    btn.disabled = false;

    if (error) {
      setStatus('statusOtp', 'Verifikasi gagal: ' + error.message, true);
      return;
    }

    setStatus('statusOtp', 'Berhasil, mengalihkan...');
    window.location.href = REDIRECT_URL;
  }

  async function resendOtp(silent) {
    if (!pendingEmail) return;
    if (!silent) setStatus('statusOtp', 'Mengirim ulang kode...');

    const { error } = await supabaseClient.auth.resend({
      type: 'signup',
      email: pendingEmail
    });

    if (error) {
      setStatus('statusOtp', 'Gagal kirim ulang: ' + error.message, true);
    } else if (!silent) {
      setStatus('statusOtp', 'Kode baru sudah dikirim.');
    }
  }
</script>

</body>
</html>
